name: AFW-BE-ACTIVITY-NOTIFICATION-1 Activity Event Publisher & Notification Routing

on:
  push:
    branches:
      - feature/backend-activity-notification-1
    paths:
      - 'backend/src/Notifications/Notifications.Domain/ActivityEvent.cs'
      - 'backend/src/Notifications/Notifications.Domain/NotificationDelivery.cs'
      - 'backend/src/Notifications/Notifications.Application/ActivityEventPublisher.cs'
      - 'backend/tests/Notifications.ActivityRouting.Scenarios/**'
      - '.github/workflows/backend-activity-notification-1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/Notifications/Notifications.Domain/ActivityEvent.cs'
      - 'backend/src/Notifications/Notifications.Domain/NotificationDelivery.cs'
      - 'backend/src/Notifications/Notifications.Application/ActivityEventPublisher.cs'
      - 'backend/tests/Notifications.ActivityRouting.Scenarios/**'
      - '.github/workflows/backend-activity-notification-1.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate AFW-BE-ACTIVITY-NOTIFICATION-1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Notifications Domain
        run: dotnet build backend/src/Notifications/Notifications.Domain/Notifications.Domain.csproj --configuration Release --nologo

      - name: Build Notifications Application
        run: dotnet build backend/src/Notifications/Notifications.Application/Notifications.Application.csproj --configuration Release --nologo

      - name: Run activity event routing scenarios
        run: dotnet run --project backend/tests/Notifications.ActivityRouting.Scenarios/Notifications.ActivityRouting.Scenarios.csproj --configuration Release
