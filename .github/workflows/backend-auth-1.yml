name: AFW-BE-AUTH-1 Backend Auth Foundation

on:
  push:
    branches:
      - feature/backend-auth-1
    paths:
      - 'backend/src/IdentityService/**'
      - 'backend/tests/IdentityService.Auth.Scenarios/**'
      - '.github/workflows/backend-auth-1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/IdentityService/**'
      - 'backend/tests/IdentityService.Auth.Scenarios/**'
      - '.github/workflows/backend-auth-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore IdentityService.Auth scenarios
        run: dotnet restore backend/tests/IdentityService.Auth.Scenarios/IdentityService.Auth.Scenarios.csproj

      - name: Build IdentityService.Api
        run: dotnet build backend/src/IdentityService/IdentityService.Api/IdentityService.Api.csproj --configuration Release --no-restore

      - name: Run AFW-BE-AUTH-1 scenarios
        run: dotnet run --project backend/tests/IdentityService.Auth.Scenarios/IdentityService.Auth.Scenarios.csproj --configuration Release --no-restore

      - name: Verify diff cleanliness
        run: git diff --check 58e9936efaa54e53219190e0ab8c56c4607888b1..HEAD
