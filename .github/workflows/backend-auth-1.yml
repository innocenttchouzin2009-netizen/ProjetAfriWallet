name: AFW-BE-AUTH-1 Backend Auth Foundation

on:
  push:
    branches:
      - feature/backend-auth-1
      - fix/backend-auth-1-certification
    paths:
      - 'AfriWallet.sln'
      - 'backend/src/IdentityService/**'
      - 'backend/tests/IdentityService.Auth.Scenarios/**'
      - '.github/workflows/backend-auth-1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'AfriWallet.sln'
      - 'backend/src/IdentityService/**'
      - 'backend/tests/IdentityService.Auth.Scenarios/**'
      - '.github/workflows/backend-auth-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore IdentityService.Auth scenarios
        run: dotnet restore

      - name: Build IdentityService.Api
        run: dotnet build backend/src/IdentityService/IdentityService.Api/IdentityService.Api.csproj --no-restore

      - name: Run AFW-BE-AUTH-1 scenarios
        run: dotnet run --project backend/tests/IdentityService.Auth.Scenarios

      - name: Verify diff cleanliness
        run: git diff --check

  certify-commit-2:
    name: Certify Commit 2 — Authentication Security Primitives
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Commit 2
        uses: actions/checkout@v4
        with:
          ref: 5be0eef3eb9a0480e34592ba830168df3764d836
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build IdentityService.Api
        run: dotnet build backend/src/IdentityService/IdentityService.Api/IdentityService.Api.csproj --no-restore

      - name: Run AFW-BE-AUTH-1 scenarios
        run: dotnet run --project backend/tests/IdentityService.Auth.Scenarios

      - name: Verify diff cleanliness
        run: git diff --check
