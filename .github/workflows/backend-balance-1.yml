name: AFW-BE-BALANCE-1 Balance Projection

on:
  push:
    branches:
      - feature/backend-balance-1
    paths:
      - 'backend/src/Balance/**'
      - 'backend/src/IdentityService/IdentityService.Api/**'
      - 'backend/tests/Balance.Projection.Scenarios/**'
      - 'backend/tests/Balance.Read.Scenarios/**'
      - 'backend/tests/Balance.Infrastructure.Scenarios/**'
      - '.github/workflows/backend-balance-1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/Balance/**'
      - 'backend/src/IdentityService/IdentityService.Api/**'
      - 'backend/tests/Balance.Projection.Scenarios/**'
      - 'backend/tests/Balance.Read.Scenarios/**'
      - 'backend/tests/Balance.Infrastructure.Scenarios/**'
      - '.github/workflows/backend-balance-1.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate AFW-BE-BALANCE-1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Balance Domain
        run: dotnet build backend/src/Balance/Balance.Domain/Balance.Domain.csproj --configuration Release --nologo

      - name: Build Balance Application
        run: dotnet build backend/src/Balance/Balance.Application/Balance.Application.csproj --configuration Release --nologo

      - name: Build Balance Infrastructure
        run: dotnet build backend/src/Balance/Balance.Infrastructure/Balance.Infrastructure.csproj --configuration Release --nologo

      - name: Run Balance projection scenarios
        run: dotnet run --project backend/tests/Balance.Projection.Scenarios/Balance.Projection.Scenarios.csproj --configuration Release

      - name: Run Balance ledger-backed read scenarios
        run: dotnet run --project backend/tests/Balance.Read.Scenarios/Balance.Read.Scenarios.csproj --configuration Release

      - name: Run Balance concrete ledger adapter scenarios
        run: dotnet run --project backend/tests/Balance.Infrastructure.Scenarios/Balance.Infrastructure.Scenarios.csproj --configuration Release

      - name: Build Identity API with Balance HTTP surface
        run: dotnet build backend/src/IdentityService/IdentityService.Api/IdentityService.Api.csproj --configuration Release --nologo
