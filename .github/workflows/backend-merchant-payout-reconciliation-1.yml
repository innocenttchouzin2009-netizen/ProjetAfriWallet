name: AFW-BE-MERCHANT-PAYOUT-RECONCILIATION-1 Protected Payout Reconciliation

on:
  push:
    branches:
      - feature/backend-merchant-payout-reconciliation-1
    paths:
      - 'backend/src/Merchants/MerchantPayout/**'
      - 'backend/src/IdentityService/IdentityService.Api/MerchantPayouts/**'
      - 'backend/src/IdentityService/IdentityService.Api/Program.cs'
      - 'backend/src/IdentityService/IdentityService.Api/IdentityService.Api.csproj'
      - 'backend/tests/MerchantPayout.Scenarios/**'
      - 'backend/tests/MerchantPayout.Reconciliation.Http.Scenarios/**'
      - '.github/workflows/backend-merchant-payout-reconciliation-1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/Merchants/MerchantPayout/**'
      - 'backend/src/IdentityService/IdentityService.Api/MerchantPayouts/**'
      - 'backend/src/IdentityService/IdentityService.Api/Program.cs'
      - 'backend/src/IdentityService/IdentityService.Api/IdentityService.Api.csproj'
      - 'backend/tests/MerchantPayout.Scenarios/**'
      - 'backend/tests/MerchantPayout.Reconciliation.Http.Scenarios/**'
      - '.github/workflows/backend-merchant-payout-reconciliation-1.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate protected merchant payout reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Merchant Payout Domain
        run: dotnet build backend/src/Merchants/MerchantPayout/MerchantPayout.Domain/MerchantPayout.Domain.csproj -c Release --nologo

      - name: Build Merchant Payout Application
        run: dotnet build backend/src/Merchants/MerchantPayout/MerchantPayout.Application/MerchantPayout.Application.csproj -c Release --nologo

      - name: Build Merchant Payout Infrastructure
        run: dotnet build backend/src/Merchants/MerchantPayout/MerchantPayout.Infrastructure/MerchantPayout.Infrastructure.csproj -c Release --nologo

      - name: Build IdentityService host
        run: dotnet build backend/src/IdentityService/IdentityService.Api/IdentityService.Api.csproj -c Release --nologo

      - name: Run Merchant Payout regression scenarios
        run: dotnet run --project backend/tests/MerchantPayout.Scenarios/MerchantPayout.Scenarios.csproj -c Release

      - name: Run protected payout reconciliation HTTP scenarios
        run: dotnet run --project backend/tests/MerchantPayout.Reconciliation.Http.Scenarios/MerchantPayout.Reconciliation.Http.Scenarios.csproj -c Release
