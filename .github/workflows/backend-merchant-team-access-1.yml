name: AFW-BE-MERCHANT-TEAM-ACCESS-1 Durable Merchant Team Access
on:
  push:
    branches: [ feature/backend-merchant-team-access-1 ]
    paths:
      - 'backend/src/Merchants/MerchantTeamAccess/**'
      - 'backend/tests/MerchantTeamAccess.Scenarios/**'
      - '.github/workflows/backend-merchant-team-access-1.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/src/Merchants/MerchantTeamAccess/**'
      - 'backend/tests/MerchantTeamAccess.Scenarios/**'
      - '.github/workflows/backend-merchant-team-access-1.yml'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - name: Build domain
        run: dotnet build backend/src/Merchants/MerchantTeamAccess/MerchantTeamAccess.Domain/MerchantTeamAccess.Domain.csproj -c Release -nologo
      - name: Build application
        run: dotnet build backend/src/Merchants/MerchantTeamAccess/MerchantTeamAccess.Application/MerchantTeamAccess.Application.csproj -c Release -nologo
      - name: Build infrastructure
        run: dotnet build backend/src/Merchants/MerchantTeamAccess/MerchantTeamAccess.Infrastructure/MerchantTeamAccess.Infrastructure.csproj -c Release -nologo
      - name: Run scenarios
        run: dotnet run --project backend/tests/MerchantTeamAccess.Scenarios/MerchantTeamAccess.Scenarios.csproj -c Release
      - name: Verify diff whitespace
        run: git diff --check HEAD^ HEAD
