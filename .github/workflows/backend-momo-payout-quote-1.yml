name: AFW-BE-MOMO-PAYOUT-QUOTE-1

on:
  push:
    branches:
      - feature/backend-momo-payout-quote-1
    paths:
      - 'backend/src/MobileMoney/MobileMoney.Api/Payout/Quote/**'
      - 'backend/src/MobileMoney/MobileMoney.Api/Payout/Domain/MobileMoneyPayoutCorridor.cs'
      - 'backend/tests/MobileMoney.Payout.Quote.Scenarios/**'
      - '.github/workflows/backend-momo-payout-quote-1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/MobileMoney/MobileMoney.Api/Payout/Quote/**'
      - 'backend/src/MobileMoney/MobileMoney.Api/Payout/Domain/MobileMoneyPayoutCorridor.cs'
      - 'backend/tests/MobileMoney.Payout.Quote.Scenarios/**'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full commit SHA to certify
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate payout quote domain and fee policy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      BASE_SHA: f707a3b2bc98abb7d51b3e3d6c30b15c5d0f25ee
      CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}

    steps:
      - name: Validate candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate SHA must be a full lowercase 40-character Git SHA."
            exit 1
          fi

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          git cat-file -e "${BASE_SHA}^{commit}"
          test "$(git merge-base "${BASE_SHA}" HEAD)" = "${BASE_SHA}"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore payout quote scenarios
        run: dotnet restore backend/tests/MobileMoney.Payout.Quote.Scenarios/MobileMoney.Payout.Quote.Scenarios.csproj

      - name: Build MobileMoney.Api
        run: dotnet build backend/src/MobileMoney/MobileMoney.Api/MobileMoney.Api.csproj --configuration Release --no-restore

      - name: Run payout quote scenarios
        run: dotnet run --project backend/tests/MobileMoney.Payout.Quote.Scenarios/MobileMoney.Payout.Quote.Scenarios.csproj --configuration Release --no-restore

      - name: Verify scoped diff cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${BASE_SHA}..HEAD"
