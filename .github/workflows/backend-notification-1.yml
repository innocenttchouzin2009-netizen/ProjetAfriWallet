name: AFW-BE-NOTIFICATION-1 Payment Request Notification & Event Foundation

on:
  push:
    branches:
      - feature/backend-notification-1
    paths:
      - 'backend/src/Notifications/**'
      - 'backend/src/PaymentRequests/PaymentRequests.Application/**'
      - 'backend/src/IdentityService/IdentityService.Api/Notifications/**'
      - 'backend/src/IdentityService/IdentityService.Api/PaymentRequests/**'
      - 'backend/src/IdentityService/IdentityService.Api/Program.cs'
      - 'backend/src/IdentityService/IdentityService.Api/appsettings.json'
      - 'backend/src/IdentityService/IdentityService.Api/IdentityService.Api.csproj'
      - 'backend/tests/Notifications.PaymentRequestEvents.Scenarios/**'
      - 'backend/tests/Notifications.PaymentRequestEmission.Scenarios/**'
      - 'backend/tests/Notifications.Inbox.Http.Scenarios/**'
      - '.github/workflows/backend-notification-1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/Notifications/**'
      - 'backend/src/PaymentRequests/PaymentRequests.Application/**'
      - 'backend/src/IdentityService/IdentityService.Api/Notifications/**'
      - 'backend/src/IdentityService/IdentityService.Api/PaymentRequests/**'
      - 'backend/src/IdentityService/IdentityService.Api/Program.cs'
      - 'backend/src/IdentityService/IdentityService.Api/appsettings.json'
      - 'backend/src/IdentityService/IdentityService.Api/IdentityService.Api.csproj'
      - 'backend/tests/Notifications.PaymentRequestEvents.Scenarios/**'
      - 'backend/tests/Notifications.PaymentRequestEmission.Scenarios/**'
      - 'backend/tests/Notifications.Inbox.Http.Scenarios/**'
      - '.github/workflows/backend-notification-1.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate AFW-BE-NOTIFICATION-1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Notifications Domain
        run: dotnet build backend/src/Notifications/Notifications.Domain/Notifications.Domain.csproj --configuration Release --nologo

      - name: Build Notifications Application
        run: dotnet build backend/src/Notifications/Notifications.Application/Notifications.Application.csproj --configuration Release --nologo

      - name: Build Notifications Persistence
        run: dotnet build backend/src/Notifications/Notifications.Persistence/Notifications.Persistence.csproj --configuration Release --nologo

      - name: Run payment request event foundation scenarios
        run: dotnet run --project backend/tests/Notifications.PaymentRequestEvents.Scenarios/Notifications.PaymentRequestEvents.Scenarios.csproj --configuration Release

      - name: Build Payment Requests Application with event integration
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Application/PaymentRequests.Application.csproj --configuration Release --nologo

      - name: Run existing payment request application scenarios
        run: dotnet run --project backend/tests/PaymentRequests.Application.Scenarios/PaymentRequests.Application.Scenarios.csproj --configuration Release

      - name: Run existing payment request action scenarios
        run: dotnet run --project backend/tests/PaymentRequests.Actions.Scenarios/PaymentRequests.Actions.Scenarios.csproj --configuration Release

      - name: Run payment request action hardening scenarios
        run: dotnet run --project backend/tests/PaymentRequests.ActionHardening.Scenarios/PaymentRequests.ActionHardening.Scenarios.csproj --configuration Release

      - name: Build IdentityService host with notification inbox wiring
        run: dotnet build backend/src/IdentityService/IdentityService.Api/IdentityService.Api.csproj --configuration Release --nologo

      - name: Run payment request event emission integration scenarios
        run: dotnet run --project backend/tests/Notifications.PaymentRequestEmission.Scenarios/Notifications.PaymentRequestEmission.Scenarios.csproj --configuration Release

      - name: Run protected in-app notification inbox HTTP scenarios
        run: dotnet run --project backend/tests/Notifications.Inbox.Http.Scenarios/Notifications.Inbox.Http.Scenarios.csproj --configuration Release
