name: AFW-BE-NOTIFICATION-ROUTING-1 Preference Enforcement & Delivery Routing

on:
  push:
    branches:
      - feature/backend-notification-routing-1
    paths:
      - 'backend/src/Notifications/Notifications.Application/**'
      - 'backend/src/Notifications/Notifications.Domain/**'
      - 'backend/tests/Notifications.Routing.Scenarios/**'
      - 'backend/tests/Notifications.Push.EventDelivery.Scenarios/**'
      - '.github/workflows/backend-notification-routing-1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/Notifications/Notifications.Application/**'
      - 'backend/src/Notifications/Notifications.Domain/**'
      - 'backend/tests/Notifications.Routing.Scenarios/**'
      - 'backend/tests/Notifications.Push.EventDelivery.Scenarios/**'
      - '.github/workflows/backend-notification-routing-1.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate AFW-BE-NOTIFICATION-ROUTING-1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Notifications Application
        run: dotnet build backend/src/Notifications/Notifications.Application/Notifications.Application.csproj --configuration Release --nologo

      - name: Run preference-aware notification routing scenarios
        run: dotnet run --project backend/tests/Notifications.Routing.Scenarios/Notifications.Routing.Scenarios.csproj --configuration Release

      - name: Run Push delivery preference enforcement scenarios
        run: dotnet run --project backend/tests/Notifications.Push.EventDelivery.Scenarios/Notifications.Push.EventDelivery.Scenarios.csproj --configuration Release
