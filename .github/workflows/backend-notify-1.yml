name: AFW-BE-NOTIFY-1 Activity Event & Notification Contracts

on:
  push:
    branches:
      - feature/backend-notify-1
    paths:
      - 'backend/src/Notifications/Notifications.Domain/ActivityEvent.cs'
      - 'backend/src/Notifications/Notifications.Application/NotificationDeliveryContracts.cs'
      - 'backend/tests/Notifications.ActivityEvent.Scenarios/**'
      - '.github/workflows/backend-notify-1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/Notifications/Notifications.Domain/ActivityEvent.cs'
      - 'backend/src/Notifications/Notifications.Application/NotificationDeliveryContracts.cs'
      - 'backend/tests/Notifications.ActivityEvent.Scenarios/**'
      - '.github/workflows/backend-notify-1.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate AFW-BE-NOTIFY-1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Notifications Domain
        run: dotnet build backend/src/Notifications/Notifications.Domain/Notifications.Domain.csproj --configuration Release --nologo

      - name: Build Notifications Application
        run: dotnet build backend/src/Notifications/Notifications.Application/Notifications.Application.csproj --configuration Release --nologo

      - name: Run activity event and notification contract scenarios
        run: dotnet run --project backend/tests/Notifications.ActivityEvent.Scenarios/Notifications.ActivityEvent.Scenarios.csproj --configuration Release
