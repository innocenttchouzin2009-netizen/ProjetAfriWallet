name: AFW-BE-PUSH-1 Push Notification Foundation

on:
  push:
    branches:
      - feature/backend-push-1
    paths:
      - 'backend/src/PushNotifications/**'
      - 'backend/src/IdentityService/IdentityService.Api/PushNotifications/**'
      - 'backend/src/IdentityService/IdentityService.Api/Program.cs'
      - 'backend/src/IdentityService/IdentityService.Api/IdentityService.Api.csproj'
      - 'backend/src/IdentityService/IdentityService.Api/appsettings.json'
      - 'backend/tests/PushNotifications.DeviceRegistration.Scenarios/**'
      - 'backend/tests/PushNotifications.Persistence.Scenarios/**'
      - 'backend/tests/PushNotifications.Http.Scenarios/**'
      - '.github/workflows/backend-push-1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/PushNotifications/**'
      - 'backend/src/IdentityService/IdentityService.Api/PushNotifications/**'
      - 'backend/src/IdentityService/IdentityService.Api/Program.cs'
      - 'backend/src/IdentityService/IdentityService.Api/IdentityService.Api.csproj'
      - 'backend/src/IdentityService/IdentityService.Api/appsettings.json'
      - 'backend/tests/PushNotifications.DeviceRegistration.Scenarios/**'
      - 'backend/tests/PushNotifications.Persistence.Scenarios/**'
      - 'backend/tests/PushNotifications.Http.Scenarios/**'
      - '.github/workflows/backend-push-1.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate AFW-BE-PUSH-1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Push Notifications Domain
        run: dotnet build backend/src/PushNotifications/PushNotifications.Domain/PushNotifications.Domain.csproj --configuration Release --nologo

      - name: Build Push Notifications Application
        run: dotnet build backend/src/PushNotifications/PushNotifications.Application/PushNotifications.Application.csproj --configuration Release --nologo

      - name: Run push device registration scenarios
        run: dotnet run --project backend/tests/PushNotifications.DeviceRegistration.Scenarios/PushNotifications.DeviceRegistration.Scenarios.csproj --configuration Release

      - name: Build Push Notifications Persistence
        run: dotnet build backend/src/PushNotifications/PushNotifications.Persistence/PushNotifications.Persistence.csproj --configuration Release --nologo

      - name: Run push device persistence scenarios
        run: dotnet run --project backend/tests/PushNotifications.Persistence.Scenarios/PushNotifications.Persistence.Scenarios.csproj --configuration Release

      - name: Build IdentityService host with push device wiring
        run: dotnet build backend/src/IdentityService/IdentityService.Api/IdentityService.Api.csproj --configuration Release --nologo

      - name: Run protected push device HTTP scenarios
        run: dotnet run --project backend/tests/PushNotifications.Http.Scenarios/PushNotifications.Http.Scenarios.csproj --configuration Release
