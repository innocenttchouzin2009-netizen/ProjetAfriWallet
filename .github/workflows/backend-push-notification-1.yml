name: AFW-BE-PUSH-NOTIFICATION-1 Push Notification Delivery

on:
  push:
    branches:
      - feature/backend-push-notification-1
    paths:
      - 'backend/src/Notifications/**'
      - 'backend/src/IdentityService/IdentityService.Api/Notifications/**'
      - 'backend/src/IdentityService/IdentityService.Api/Program.cs'
      - 'backend/tests/Notifications.PushDelivery.Scenarios/**'
      - 'backend/tests/Notifications.PushRegistration.Scenarios/**'
      - 'backend/tests/Notifications.PushRegistration.Http.Scenarios/**'
      - 'backend/tests/Notifications.PushProvider.Scenarios/**'
      - '.github/workflows/backend-push-notification-1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/Notifications/**'
      - 'backend/src/IdentityService/IdentityService.Api/Notifications/**'
      - 'backend/src/IdentityService/IdentityService.Api/Program.cs'
      - 'backend/tests/Notifications.PushDelivery.Scenarios/**'
      - 'backend/tests/Notifications.PushRegistration.Scenarios/**'
      - 'backend/tests/Notifications.PushRegistration.Http.Scenarios/**'
      - 'backend/tests/Notifications.PushProvider.Scenarios/**'
      - '.github/workflows/backend-push-notification-1.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate AFW-BE-PUSH-NOTIFICATION-1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Notifications Application
        run: dotnet build backend/src/Notifications/Notifications.Application/Notifications.Application.csproj --configuration Release --nologo

      - name: Run provider-neutral push delivery scenarios
        run: dotnet run --project backend/tests/Notifications.PushDelivery.Scenarios/Notifications.PushDelivery.Scenarios.csproj --configuration Release

      - name: Build Notifications Persistence
        run: dotnet build backend/src/Notifications/Notifications.Persistence/Notifications.Persistence.csproj --configuration Release --nologo

      - name: Run device push registration persistence scenarios
        run: dotnet run --project backend/tests/Notifications.PushRegistration.Scenarios/Notifications.PushRegistration.Scenarios.csproj --configuration Release

      - name: Build Notifications Push Infrastructure
        run: dotnet build backend/src/Notifications/Notifications.Push.Infrastructure/Notifications.Push.Infrastructure.csproj --configuration Release --nologo

      - name: Run push provider adapter and delivery orchestration scenarios
        run: dotnet run --project backend/tests/Notifications.PushProvider.Scenarios/Notifications.PushProvider.Scenarios.csproj --configuration Release

      - name: Build IdentityService host with device push registration wiring
        run: dotnet build backend/src/IdentityService/IdentityService.Api/IdentityService.Api.csproj --configuration Release --nologo

      - name: Run protected device push registration HTTP scenarios
        run: dotnet run --project backend/tests/Notifications.PushRegistration.Http.Scenarios/Notifications.PushRegistration.Http.Scenarios.csproj --configuration Release
