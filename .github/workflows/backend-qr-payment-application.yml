name: AFW-BE-QR-PAYMENT-CONTRACT-2

on:
  push:
    branches:
      - feature/backend-qr-payment-contract-2
    paths:
      - 'backend/src/Merchant/Merchant.Application/**'
      - 'backend/src/Merchant/Merchant.Api/**'
      - 'backend/tests/QrPayment.Contract.Scenarios/**'
      - 'backend/tests/QrPayment.Application.Scenarios/**'
      - 'backend/tests/QrPayment.Http.Scenarios/**'
      - '.github/workflows/backend-qr-payment-application.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/Merchant/Merchant.Application/**'
      - 'backend/src/Merchant/Merchant.Api/**'
      - 'backend/tests/QrPayment.Contract.Scenarios/**'
      - 'backend/tests/QrPayment.Application.Scenarios/**'
      - 'backend/tests/QrPayment.Http.Scenarios/**'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full commit SHA to certify
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Certify QR Payment backend contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}

    steps:
      - name: Validate candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate SHA must be a full lowercase 40-character Git SHA."
            exit 1
          fi

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          git cat-file -e "${CANDIDATE_SHA}^{commit}"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build Merchant API
        run: dotnet build backend/src/Merchant/Merchant.Api/Merchant.Api.csproj

      - name: Run QR payment contract scenarios
        run: dotnet run --project backend/tests/QrPayment.Contract.Scenarios

      - name: Run QR payment application scenarios
        run: dotnet run --project backend/tests/QrPayment.Application.Scenarios

      - name: Run QR payment HTTP scenarios
        run: dotnet run --project backend/tests/QrPayment.Http.Scenarios

      - name: Verify diff cleanliness
        run: git diff --check
