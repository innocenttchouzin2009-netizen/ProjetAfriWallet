name: AFW-BE-RECONCILIATION-REMEDIATION-1

on:
  push:
    branches:
      - feature/backend-reconciliation-remediation-1
    paths:
      - 'backend/src/FinancialPlatform/Reconciliation/Reconciliation.Domain/Remediation/**'
      - 'backend/src/FinancialPlatform/Reconciliation/Reconciliation.Application/Remediation/**'
      - 'backend/src/FinancialPlatform/Reconciliation/Reconciliation.Infrastructure/Remediation/**'
      - 'backend/tests/Reconciliation.RemediationFoundation.Scenarios/**'
      - 'backend/tests/Reconciliation.RemediationPersistence.Scenarios/**'
      - '.github/workflows/backend-reconciliation-remediation-1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/FinancialPlatform/Reconciliation/Reconciliation.Domain/Remediation/**'
      - 'backend/src/FinancialPlatform/Reconciliation/Reconciliation.Application/Remediation/**'
      - 'backend/src/FinancialPlatform/Reconciliation/Reconciliation.Infrastructure/Remediation/**'
      - 'backend/tests/Reconciliation.RemediationFoundation.Scenarios/**'
      - 'backend/tests/Reconciliation.RemediationPersistence.Scenarios/**'
      - '.github/workflows/backend-reconciliation-remediation-1.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate reconciliation corrective action foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Reconciliation Domain
        run: dotnet build backend/src/FinancialPlatform/Reconciliation/Reconciliation.Domain/Reconciliation.Domain.csproj --configuration Release --nologo

      - name: Build Reconciliation Application
        run: dotnet build backend/src/FinancialPlatform/Reconciliation/Reconciliation.Application/Reconciliation.Application.csproj --configuration Release --nologo

      - name: Build Reconciliation Infrastructure
        run: dotnet build backend/src/FinancialPlatform/Reconciliation/Reconciliation.Infrastructure/Reconciliation.Infrastructure.csproj --configuration Release --nologo

      - name: Run corrective action domain and application foundation scenarios
        run: dotnet run --project backend/tests/Reconciliation.RemediationFoundation.Scenarios/Reconciliation.RemediationFoundation.Scenarios.csproj --configuration Release

      - name: Run corrective action persistence and durable audit scenarios
        run: dotnet run --project backend/tests/Reconciliation.RemediationPersistence.Scenarios/Reconciliation.RemediationPersistence.Scenarios.csproj --configuration Release

      - name: Run existing reconciliation resolution foundation scenarios
        run: dotnet run --project backend/tests/Reconciliation.ResolutionFoundation.Scenarios/Reconciliation.ResolutionFoundation.Scenarios.csproj --configuration Release
