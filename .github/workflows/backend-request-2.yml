name: AFW-BE-REQUEST-2 Delivery Reliability & Webhook Subscription Foundation

on:
  push:
    branches:
      - feature/backend-request-2
    paths:
      - 'backend/src/PaymentRequests/**'
      - 'backend/tests/PaymentRequests.WebhookDestinationRegistry.Scenarios/**'
      - '.github/workflows/backend-request-2.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/PaymentRequests/**'
      - 'backend/tests/PaymentRequests.WebhookDestinationRegistry.Scenarios/**'
      - '.github/workflows/backend-request-2.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate AFW-BE-REQUEST-2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Payment Requests Domain
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Domain/PaymentRequests.Domain.csproj --configuration Release --nologo

      - name: Build Payment Requests Application
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Application/PaymentRequests.Application.csproj --configuration Release --nologo

      - name: Build Payment Requests Persistence
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Persistence/PaymentRequests.Persistence.csproj --configuration Release --nologo

      - name: Run webhook destination registry and delivery policy scenarios
        run: dotnet run --project backend/tests/PaymentRequests.WebhookDestinationRegistry.Scenarios/PaymentRequests.WebhookDestinationRegistry.Scenarios.csproj --configuration Release
