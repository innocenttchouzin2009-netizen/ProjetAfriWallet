name: AFW-BE-REQUEST-ACTIONS-2 Clean Payment Request Action Baseline

on:
  push:
    branches:
      - feature/backend-request-actions-2
    paths:
      - 'backend/src/PaymentRequests/**'
      - 'backend/src/IdentityService/IdentityService.Api/PaymentRequests/**'
      - 'backend/src/IdentityService/IdentityService.Api/Program.cs'
      - 'backend/src/IdentityService/IdentityService.Api/IdentityService.Api.csproj'
      - 'backend/tests/PaymentRequests.Actions.Scenarios/**'
      - 'backend/tests/PaymentRequests.ActionHardening.Scenarios/**'
      - 'backend/tests/PaymentRequests.Actions.Http.Scenarios/**'
      - '.github/workflows/backend-request-actions-2.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/PaymentRequests/**'
      - 'backend/src/IdentityService/IdentityService.Api/PaymentRequests/**'
      - 'backend/src/IdentityService/IdentityService.Api/Program.cs'
      - 'backend/src/IdentityService/IdentityService.Api/IdentityService.Api.csproj'
      - 'backend/tests/PaymentRequests.Actions.Scenarios/**'
      - 'backend/tests/PaymentRequests.ActionHardening.Scenarios/**'
      - 'backend/tests/PaymentRequests.Actions.Http.Scenarios/**'
      - '.github/workflows/backend-request-actions-2.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate AFW-BE-REQUEST-ACTIONS-2
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Payment Requests Domain
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Domain/PaymentRequests.Domain.csproj --configuration Release --nologo

      - name: Build Payment Requests Application
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Application/PaymentRequests.Application.csproj --configuration Release --nologo

      - name: Build Payment Requests Persistence
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Persistence/PaymentRequests.Persistence.csproj --configuration Release --nologo

      - name: Build IdentityService host
        run: dotnet build backend/src/IdentityService/IdentityService.Api/IdentityService.Api.csproj --configuration Release --nologo

      - name: Run certified payment request action scenarios
        run: dotnet run --project backend/tests/PaymentRequests.Actions.Scenarios/PaymentRequests.Actions.Scenarios.csproj --configuration Release

      - name: Run payer binding hardening scenarios
        run: dotnet run --project backend/tests/PaymentRequests.ActionHardening.Scenarios/PaymentRequests.ActionHardening.Scenarios.csproj --configuration Release

      - name: Run authenticated payment request action HTTP scenarios
        run: dotnet run --project backend/tests/PaymentRequests.Actions.Http.Scenarios/PaymentRequests.Actions.Http.Scenarios.csproj --configuration Release
