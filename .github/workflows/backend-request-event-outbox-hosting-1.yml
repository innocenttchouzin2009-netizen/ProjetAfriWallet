name: AFW-BE-REQUEST-EVENT-OUTBOX-HOSTING-1 Event Outbox Dispatcher Hosting

on:
  push:
    branches:
      - feature/backend-request-event-outbox-hosting-1
    paths:
      - 'backend/src/IdentityService/IdentityService.Api/PaymentRequests/PaymentRequestEventOutbox*'
      - 'backend/src/IdentityService/IdentityService.Api/Program.cs'
      - 'backend/src/IdentityService/IdentityService.Api/appsettings.json'
      - 'backend/tests/PaymentRequests.EventOutbox.Hosting.Scenarios/**'
      - '.github/workflows/backend-request-event-outbox-hosting-1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/IdentityService/IdentityService.Api/PaymentRequests/PaymentRequestEventOutbox*'
      - 'backend/src/IdentityService/IdentityService.Api/Program.cs'
      - 'backend/src/IdentityService/IdentityService.Api/appsettings.json'
      - 'backend/tests/PaymentRequests.EventOutbox.Hosting.Scenarios/**'
      - '.github/workflows/backend-request-event-outbox-hosting-1.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate AFW-BE-REQUEST-EVENT-OUTBOX-HOSTING-1
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Payment Requests Application
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Application/PaymentRequests.Application.csproj --configuration Release --nologo

      - name: Build Payment Requests Persistence
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Persistence/PaymentRequests.Persistence.csproj --configuration Release --nologo

      - name: Build IdentityService host with outbox hosting
        run: dotnet build backend/src/IdentityService/IdentityService.Api/IdentityService.Api.csproj --configuration Release --nologo

      - name: Run durable payment request event outbox regression scenarios
        run: dotnet run --project backend/tests/PaymentRequests.EventOutbox.Scenarios/PaymentRequests.EventOutbox.Scenarios.csproj --configuration Release

      - name: Run payment request event outbox hosting scenarios
        run: dotnet run --project backend/tests/PaymentRequests.EventOutbox.Hosting.Scenarios/PaymentRequests.EventOutbox.Hosting.Scenarios.csproj --configuration Release
