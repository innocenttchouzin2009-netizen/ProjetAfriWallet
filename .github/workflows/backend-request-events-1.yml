name: AFW-BE-REQUEST-EVENTS-1 Durable Payment Request Event Outbox

on:
  push:
    branches:
      - feature/backend-request-events-1
    paths:
      - 'backend/src/PaymentRequests/**'
      - 'backend/src/IdentityService/IdentityService.Api/PaymentRequests/**'
      - 'backend/src/IdentityService/IdentityService.Api/Program.cs'
      - 'backend/tests/PaymentRequests.EventOutbox.Scenarios/**'
      - 'backend/tests/PaymentRequests.EventWorker.Scenarios/**'
      - 'backend/tests/PaymentRequests.EventOutbox.Operational.Scenarios/**'
      - '.github/workflows/backend-request-events-1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/PaymentRequests/**'
      - 'backend/src/IdentityService/IdentityService.Api/PaymentRequests/**'
      - 'backend/src/IdentityService/IdentityService.Api/Program.cs'
      - 'backend/tests/PaymentRequests.EventOutbox.Scenarios/**'
      - 'backend/tests/PaymentRequests.EventWorker.Scenarios/**'
      - 'backend/tests/PaymentRequests.EventOutbox.Operational.Scenarios/**'
      - '.github/workflows/backend-request-events-1.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate AFW-BE-REQUEST-EVENTS-1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Payment Requests Application
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Application/PaymentRequests.Application.csproj --configuration Release --nologo

      - name: Build Payment Requests Persistence
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Persistence/PaymentRequests.Persistence.csproj --configuration Release --nologo

      - name: Run durable payment request event outbox and transport scenarios
        run: dotnet run --project backend/tests/PaymentRequests.EventOutbox.Scenarios/PaymentRequests.EventOutbox.Scenarios.csproj --configuration Release

      - name: Build IdentityService host with outbox worker wiring
        run: dotnet build backend/src/IdentityService/IdentityService.Api/IdentityService.Api.csproj --configuration Release --nologo

      - name: Run hosted outbox worker scenarios
        run: dotnet run --project backend/tests/PaymentRequests.EventWorker.Scenarios/PaymentRequests.EventWorker.Scenarios.csproj --configuration Release

      - name: Run operational outbox observability and readiness scenarios
        run: dotnet run --project backend/tests/PaymentRequests.EventOutbox.Operational.Scenarios/PaymentRequests.EventOutbox.Operational.Scenarios.csproj --configuration Release
