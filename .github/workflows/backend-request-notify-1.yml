name: AFW-BE-REQUEST-NOTIFY-1 Payment Request Notifications

on:
  push:
    branches:
      - feature/backend-request-notify-1
    paths:
      - 'backend/src/PaymentRequests/PaymentRequests.Domain/PaymentRequestNotification.cs'
      - 'backend/src/PaymentRequests/PaymentRequests.Application/PaymentRequestNotificationProjectionContracts.cs'
      - 'backend/src/PaymentRequests/PaymentRequests.Application/PaymentRequestNotificationProjectionEngine.cs'
      - 'backend/src/PaymentRequests/PaymentRequests.Application/PaymentRequestNotificationAudienceResolver.cs'
      - 'backend/src/PaymentRequests/PaymentRequests.Application/PaymentRequests.Application.csproj'
      - 'backend/src/PaymentRequests/PaymentRequests.Notification.Persistence/**'
      - 'backend/tests/PaymentRequests.NotificationProjection.Scenarios/**'
      - 'backend/tests/PaymentRequests.NotificationProjectionEngine.Scenarios/**'
      - 'backend/tests/PaymentRequests.NotificationPersistence.Scenarios/**'
      - '.github/workflows/backend-request-notify-1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/PaymentRequests/PaymentRequests.Domain/PaymentRequestNotification.cs'
      - 'backend/src/PaymentRequests/PaymentRequests.Application/PaymentRequestNotificationProjectionContracts.cs'
      - 'backend/src/PaymentRequests/PaymentRequests.Application/PaymentRequestNotificationProjectionEngine.cs'
      - 'backend/src/PaymentRequests/PaymentRequests.Application/PaymentRequestNotificationAudienceResolver.cs'
      - 'backend/src/PaymentRequests/PaymentRequests.Application/PaymentRequests.Application.csproj'
      - 'backend/src/PaymentRequests/PaymentRequests.Notification.Persistence/**'
      - 'backend/tests/PaymentRequests.NotificationProjection.Scenarios/**'
      - 'backend/tests/PaymentRequests.NotificationProjectionEngine.Scenarios/**'
      - 'backend/tests/PaymentRequests.NotificationPersistence.Scenarios/**'
      - '.github/workflows/backend-request-notify-1.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate AFW-BE-REQUEST-NOTIFY-1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Payment Requests Domain
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Domain/PaymentRequests.Domain.csproj --configuration Release --nologo

      - name: Build Payment Requests Application
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Application/PaymentRequests.Application.csproj --configuration Release --nologo

      - name: Run notification domain and projection contract scenarios
        run: dotnet run --project backend/tests/PaymentRequests.NotificationProjection.Scenarios/PaymentRequests.NotificationProjection.Scenarios.csproj --configuration Release

      - name: Run lifecycle event notification projection engine scenarios
        run: dotnet run --project backend/tests/PaymentRequests.NotificationProjectionEngine.Scenarios/PaymentRequests.NotificationProjectionEngine.Scenarios.csproj --configuration Release

      - name: Build durable notification projection persistence
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Notification.Persistence/PaymentRequests.Notification.Persistence.csproj --configuration Release --nologo

      - name: Run durable notification projection persistence scenarios
        run: dotnet run --project backend/tests/PaymentRequests.NotificationPersistence.Scenarios/PaymentRequests.NotificationPersistence.Scenarios.csproj --configuration Release

      - name: Run lifecycle event production regression scenarios
        run: dotnet run --project backend/tests/PaymentRequests.EventProduction.Scenarios/PaymentRequests.EventProduction.Scenarios.csproj --configuration Release
