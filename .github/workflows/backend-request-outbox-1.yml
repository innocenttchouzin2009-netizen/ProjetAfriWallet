name: AFW-BE-REQUEST-OUTBOX-1 Durable Payment Request Event Outbox

on:
  push:
    branches:
      - feature/backend-request-outbox-1
    paths:
      - 'backend/src/PaymentRequests/**'
      - 'backend/tests/PaymentRequests.*/**'
      - '.github/workflows/backend-request-outbox-1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/PaymentRequests/**'
      - 'backend/tests/PaymentRequests.*/**'
      - '.github/workflows/backend-request-outbox-1.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate AFW-BE-REQUEST-OUTBOX-1
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Payment Requests Domain
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Domain/PaymentRequests.Domain.csproj --configuration Release --nologo

      - name: Build Payment Requests Application
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Application/PaymentRequests.Application.csproj --configuration Release --nologo

      - name: Build Payment Requests Persistence
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Persistence/PaymentRequests.Persistence.csproj --configuration Release --nologo

      - name: Build IdentityService host
        run: dotnet build backend/src/IdentityService/IdentityService.Api/IdentityService.Api.csproj --configuration Release --nologo

      - name: Run payment request domain scenarios
        run: dotnet run --project backend/tests/PaymentRequests.Domain.Scenarios/PaymentRequests.Domain.Scenarios.csproj --configuration Release

      - name: Run payment request application scenarios
        run: dotnet run --project backend/tests/PaymentRequests.Application.Scenarios/PaymentRequests.Application.Scenarios.csproj --configuration Release

      - name: Run payment request persistence scenarios
        run: dotnet run --project backend/tests/PaymentRequests.Persistence.Scenarios/PaymentRequests.Persistence.Scenarios.csproj --configuration Release

      - name: Run payment request action scenarios
        run: dotnet run --project backend/tests/PaymentRequests.Actions.Scenarios/PaymentRequests.Actions.Scenarios.csproj --configuration Release

      - name: Run payment request action hardening scenarios
        run: dotnet run --project backend/tests/PaymentRequests.ActionHardening.Scenarios/PaymentRequests.ActionHardening.Scenarios.csproj --configuration Release

      - name: Run payment request query scenarios
        run: dotnet run --project backend/tests/PaymentRequests.Query.Scenarios/PaymentRequests.Query.Scenarios.csproj --configuration Release

      - name: Run payment request authorized query scenarios
        run: dotnet run --project backend/tests/PaymentRequests.AuthorizedQuery.Scenarios/PaymentRequests.AuthorizedQuery.Scenarios.csproj --configuration Release

      - name: Run payment request ownership adapter scenarios
        run: dotnet run --project backend/tests/PaymentRequests.OwnershipAdapters.Scenarios/PaymentRequests.OwnershipAdapters.Scenarios.csproj --configuration Release

      - name: Run payment request HTTP scenarios
        run: dotnet run --project backend/tests/PaymentRequests.Http.Scenarios/PaymentRequests.Http.Scenarios.csproj --configuration Release

      - name: Run payment request action HTTP scenarios
        run: dotnet run --project backend/tests/PaymentRequests.Actions.Http.Scenarios/PaymentRequests.Actions.Http.Scenarios.csproj --configuration Release

      - name: Run payment request inbox/outbox HTTP scenarios
        run: dotnet run --project backend/tests/PaymentRequests.InboxOutbox.Http.Scenarios/PaymentRequests.InboxOutbox.Http.Scenarios.csproj --configuration Release

      - name: Run durable payment request event outbox scenarios
        run: dotnet run --project backend/tests/PaymentRequests.EventOutbox.Scenarios/PaymentRequests.EventOutbox.Scenarios.csproj --configuration Release
