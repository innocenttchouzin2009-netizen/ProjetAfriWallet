name: AFW-BE-REQUEST-OUTBOX-RECOVERY-1 Dead-Letter Recovery
on:
  push:
    branches:
      - feature/backend-request-outbox-recovery-1
    paths:
      - 'backend/src/PaymentRequests/PaymentRequests.Application/**'
      - 'backend/src/PaymentRequests/PaymentRequests.Persistence/**'
      - 'backend/tests/PaymentRequests.EventDeadLetterRecovery.Scenarios/**'
      - 'backend/tests/PaymentRequests.EventDeadLetterRecovery.Application.Scenarios/**'
      - 'backend/tests/PaymentRequests.EventDeadLetterRecovery.Persistence.Scenarios/**'
      - '.github/workflows/backend-request-outbox-recovery-1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/src/PaymentRequests/PaymentRequests.Application/**'
      - 'backend/src/PaymentRequests/PaymentRequests.Persistence/**'
      - 'backend/tests/PaymentRequests.EventDeadLetterRecovery.Scenarios/**'
      - 'backend/tests/PaymentRequests.EventDeadLetterRecovery.Application.Scenarios/**'
      - 'backend/tests/PaymentRequests.EventDeadLetterRecovery.Persistence.Scenarios/**'
      - '.github/workflows/backend-request-outbox-recovery-1.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate dead-letter recovery policy, orchestration and persistence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }

      - name: Build Payment Requests Application
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Application/PaymentRequests.Application.csproj --configuration Release --nologo

      - name: Run dead-letter recovery policy scenarios
        run: dotnet run --project backend/tests/PaymentRequests.EventDeadLetterRecovery.Scenarios/PaymentRequests.EventDeadLetterRecovery.Scenarios.csproj --configuration Release

      - name: Run dead-letter recovery application orchestration scenarios
        run: dotnet run --project backend/tests/PaymentRequests.EventDeadLetterRecovery.Application.Scenarios/PaymentRequests.EventDeadLetterRecovery.Application.Scenarios.csproj --configuration Release

      - name: Build Payment Requests Persistence
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Persistence/PaymentRequests.Persistence.csproj --configuration Release --nologo

      - name: Run dead-letter recovery persistence scenarios
        run: dotnet run --project backend/tests/PaymentRequests.EventDeadLetterRecovery.Persistence.Scenarios/PaymentRequests.EventDeadLetterRecovery.Persistence.Scenarios.csproj --configuration Release
