name: AFW-BE-REQUEST-OUTBOX-RESTART-RECOVERY-1

on:
  push:
    branches:
      - feature/backend-request-outbox-restart-recovery-1
    paths:
      - 'backend/src/PaymentRequests/**'
      - 'backend/src/IdentityService/IdentityService.Api/PaymentRequests/**'
      - 'backend/tests/PaymentRequests.EventRestartRecovery.Scenarios/**'
      - 'backend/tests/PaymentRequests.EventAttemptLedger.Scenarios/**'
      - 'backend/tests/PaymentRequests.WebhookReintegration.Scenarios/**'
      - '.github/workflows/backend-request-outbox-restart-recovery-1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/src/PaymentRequests/**'
      - 'backend/src/IdentityService/IdentityService.Api/PaymentRequests/**'
      - 'backend/tests/PaymentRequests.EventRestartRecovery.Scenarios/**'
      - 'backend/tests/PaymentRequests.EventAttemptLedger.Scenarios/**'
      - 'backend/tests/PaymentRequests.WebhookReintegration.Scenarios/**'
      - '.github/workflows/backend-request-outbox-restart-recovery-1.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate durable restart recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Payment Requests Application
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Application/PaymentRequests.Application.csproj --configuration Release --nologo

      - name: Build Payment Requests Persistence
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Persistence/PaymentRequests.Persistence.csproj --configuration Release --nologo

      - name: Build IdentityService composition
        run: dotnet build backend/src/IdentityService/IdentityService.Api/IdentityService.Api.csproj --configuration Release --nologo

      - name: Run durable restart-safe recovery scenarios
        run: dotnet run --project backend/tests/PaymentRequests.EventRestartRecovery.Scenarios/PaymentRequests.EventRestartRecovery.Scenarios.csproj --configuration Release

      - name: Run Attempt Ledger atomic finalization regression
        run: dotnet run --project backend/tests/PaymentRequests.EventAttemptLedger.Scenarios/PaymentRequests.EventAttemptLedger.Scenarios.csproj --configuration Release

      - name: Run HMAC HTTP webhook reintegration regression
        run: dotnet run --project backend/tests/PaymentRequests.WebhookReintegration.Scenarios/PaymentRequests.WebhookReintegration.Scenarios.csproj --configuration Release
