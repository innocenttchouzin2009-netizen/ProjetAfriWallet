name: AFW-BE-REQUEST-RECONCILE-1 Reconciliation Foundation

on:
  push:
    branches:
      - feature/backend-request-reconcile-1
    paths:
      - 'backend/src/PaymentRequests/PaymentRequests.Reconciliation.Application/**'
      - 'backend/src/PaymentRequests/PaymentRequests.Reconciliation.Persistence/**'
      - 'backend/src/PaymentRequests/PaymentRequests.Reconciliation.Infrastructure/**'
      - 'backend/tests/PaymentRequests.Reconciliation.Application.Scenarios/**'
      - 'backend/tests/PaymentRequests.Reconciliation.Persistence.Scenarios/**'
      - 'backend/tests/PaymentRequests.Reconciliation.Infrastructure.Scenarios/**'
      - '.github/workflows/backend-request-reconcile-1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/PaymentRequests/PaymentRequests.Reconciliation.Application/**'
      - 'backend/src/PaymentRequests/PaymentRequests.Reconciliation.Persistence/**'
      - 'backend/src/PaymentRequests/PaymentRequests.Reconciliation.Infrastructure/**'
      - 'backend/tests/PaymentRequests.Reconciliation.Application.Scenarios/**'
      - 'backend/tests/PaymentRequests.Reconciliation.Persistence.Scenarios/**'
      - 'backend/tests/PaymentRequests.Reconciliation.Infrastructure.Scenarios/**'
      - '.github/workflows/backend-request-reconcile-1.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate AFW-BE-REQUEST-RECONCILE-1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build reconciliation application
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Reconciliation.Application/PaymentRequests.Reconciliation.Application.csproj --configuration Release --nologo

      - name: Run reconciliation application scenarios
        run: dotnet run --project backend/tests/PaymentRequests.Reconciliation.Application.Scenarios/PaymentRequests.Reconciliation.Application.Scenarios.csproj --configuration Release

      - name: Build reconciliation persistence
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Reconciliation.Persistence/PaymentRequests.Reconciliation.Persistence.csproj --configuration Release --nologo

      - name: Run reconciliation persistence scenarios
        run: dotnet run --project backend/tests/PaymentRequests.Reconciliation.Persistence.Scenarios/PaymentRequests.Reconciliation.Persistence.Scenarios.csproj --configuration Release

      - name: Build reconciliation infrastructure
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Reconciliation.Infrastructure/PaymentRequests.Reconciliation.Infrastructure.csproj --configuration Release --nologo

      - name: Run reconciliation infrastructure scenarios
        run: dotnet run --project backend/tests/PaymentRequests.Reconciliation.Infrastructure.Scenarios/PaymentRequests.Reconciliation.Infrastructure.Scenarios.csproj --configuration Release
