# AFW-BE-REQUEST webhook delivery certification: Commit 4 registry-backed routing and per-destination retry
name: AFW-BE-REQUEST Webhook Delivery Foundation

on:
  push:
    branches:
      - feature/backend-request-webhook-delivery-1
    paths:
      - 'backend/src/PaymentRequests/PaymentRequests.Application/**'
      - 'backend/src/PaymentRequests/PaymentRequests.Webhooks/**'
      - 'backend/tests/PaymentRequests.WebhookDelivery.Scenarios/**'
      - 'backend/tests/PaymentRequests.WebhookPlanning.Scenarios/**'
      - 'backend/tests/PaymentRequests.WebhookExecution.Scenarios/**'
      - '.github/workflows/backend-request-webhook-delivery-1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/PaymentRequests/PaymentRequests.Application/**'
      - 'backend/src/PaymentRequests/PaymentRequests.Webhooks/**'
      - 'backend/tests/PaymentRequests.WebhookDelivery.Scenarios/**'
      - 'backend/tests/PaymentRequests.WebhookPlanning.Scenarios/**'
      - 'backend/tests/PaymentRequests.WebhookExecution.Scenarios/**'
      - '.github/workflows/backend-request-webhook-delivery-1.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate request webhook delivery foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Payment Requests Application
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Application/PaymentRequests.Application.csproj --configuration Release --nologo

      - name: Run webhook delivery foundation scenarios
        run: dotnet run --project backend/tests/PaymentRequests.WebhookDelivery.Scenarios/PaymentRequests.WebhookDelivery.Scenarios.csproj --configuration Release

      - name: Run webhook destination resolution and fan-out planning scenarios
        run: dotnet run --project backend/tests/PaymentRequests.WebhookPlanning.Scenarios/PaymentRequests.WebhookPlanning.Scenarios.csproj --configuration Release

      - name: Build Payment Requests Webhooks
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Webhooks/PaymentRequests.Webhooks.csproj --configuration Release --nologo

      - name: Run registry-backed delivery execution scenarios
        run: dotnet run --project backend/tests/PaymentRequests.WebhookExecution.Scenarios/PaymentRequests.WebhookExecution.Scenarios.csproj --configuration Release
