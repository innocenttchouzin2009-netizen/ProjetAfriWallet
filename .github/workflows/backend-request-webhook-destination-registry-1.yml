name: AFW-BE-REQUEST Webhook Destination Registry Commit 3

on:
  push:
    branches:
      - feature/backend-request-webhook-destination-registry-1
    paths:
      - 'backend/src/PaymentRequests/PaymentRequests.Webhooks/**'
      - 'backend/src/PaymentRequests/PaymentRequests.DeliverySubscriptions.Persistence/**'
      - 'backend/tests/PaymentRequests.DeliverySubscriptions.Persistence.Scenarios/**'
      - '.github/workflows/backend-request-webhook-destination-registry-1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/src/PaymentRequests/PaymentRequests.Webhooks/**'
      - 'backend/src/PaymentRequests/PaymentRequests.DeliverySubscriptions.Persistence/**'
      - 'backend/tests/PaymentRequests.DeliverySubscriptions.Persistence.Scenarios/**'
      - '.github/workflows/backend-request-webhook-destination-registry-1.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate authoritative destination registry persistence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build Payment Request Webhooks
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Webhooks/PaymentRequests.Webhooks.csproj --configuration Release --nologo
      - name: Build Delivery Subscription Persistence
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.DeliverySubscriptions.Persistence/PaymentRequests.DeliverySubscriptions.Persistence.csproj --configuration Release --nologo
      - name: Run destination registry persistence scenarios
        run: dotnet run --project backend/tests/PaymentRequests.DeliverySubscriptions.Persistence.Scenarios/PaymentRequests.DeliverySubscriptions.Persistence.Scenarios.csproj --configuration Release
