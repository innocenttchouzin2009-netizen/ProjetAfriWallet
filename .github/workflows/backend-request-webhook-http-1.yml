name: AFW-BE-REQUEST Commit 8 Signed Webhook HTTP Delivery

on:
  push:
    branches:
      - feature/backend-request-webhook-http-1
    paths:
      - 'backend/src/PaymentRequests/PaymentRequests.Webhooks/**'
      - 'backend/src/IdentityService/IdentityService.Api/PaymentRequests/PaymentRequestWebhookHttpComposition.cs'
      - 'backend/src/IdentityService/IdentityService.Api/Program.cs'
      - 'backend/src/IdentityService/IdentityService.Api/IdentityService.Api.csproj'
      - 'backend/src/IdentityService/IdentityService.Api/appsettings.json'
      - 'backend/tests/PaymentRequests.WebhookHttp.Scenarios/**'
      - '.github/workflows/backend-request-webhook-http-1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/PaymentRequests/PaymentRequests.Webhooks/**'
      - 'backend/src/IdentityService/IdentityService.Api/PaymentRequests/PaymentRequestWebhookHttpComposition.cs'
      - 'backend/src/IdentityService/IdentityService.Api/Program.cs'
      - 'backend/src/IdentityService/IdentityService.Api/IdentityService.Api.csproj'
      - 'backend/src/IdentityService/IdentityService.Api/appsettings.json'
      - 'backend/tests/PaymentRequests.WebhookHttp.Scenarios/**'
      - '.github/workflows/backend-request-webhook-http-1.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate signed webhook HTTP delivery and receiver
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Payment Request Webhooks
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Webhooks/PaymentRequests.Webhooks.csproj --configuration Release --nologo

      - name: Build IdentityService host composition
        run: dotnet build backend/src/IdentityService/IdentityService.Api/IdentityService.Api.csproj --configuration Release --nologo

      - name: Run signed webhook HTTP scenarios
        run: dotnet run --project backend/tests/PaymentRequests.WebhookHttp.Scenarios/PaymentRequests.WebhookHttp.Scenarios.csproj --configuration Release
