name: AFW-BE-REQUEST Commit 12 Webhook Delivery Reliability

on:
  push:
    branches:
      - feature/backend-request-webhook-reliability-1
    paths:
      - 'backend/src/PaymentRequests/PaymentRequests.Webhooks/**'
      - 'backend/src/PaymentRequests/PaymentRequests.WebhookSubscriptions.Persistence/**'
      - 'backend/src/IdentityService/IdentityService.Api/PaymentRequests/**'
      - 'backend/tests/PaymentRequests.WebhookSecurity.Scenarios/**'
      - 'backend/tests/PaymentRequests.WebhookHttp.Scenarios/**'
      - 'backend/tests/PaymentRequests.WebhookRegistry.Scenarios/**'
      - 'backend/tests/PaymentRequests.WebhookManagement.Http.Scenarios/**'
      - 'backend/tests/PaymentRequests.WebhookOperations.Http.Scenarios/**'
      - 'backend/tests/PaymentRequests.WebhookReliability.Scenarios/**'
      - '.github/workflows/backend-request-webhook-reliability-1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/PaymentRequests/PaymentRequests.Webhooks/**'
      - 'backend/src/PaymentRequests/PaymentRequests.WebhookSubscriptions.Persistence/**'
      - 'backend/src/IdentityService/IdentityService.Api/PaymentRequests/**'
      - 'backend/tests/PaymentRequests.WebhookSecurity.Scenarios/**'
      - 'backend/tests/PaymentRequests.WebhookHttp.Scenarios/**'
      - 'backend/tests/PaymentRequests.WebhookRegistry.Scenarios/**'
      - 'backend/tests/PaymentRequests.WebhookManagement.Http.Scenarios/**'
      - 'backend/tests/PaymentRequests.WebhookOperations.Http.Scenarios/**'
      - 'backend/tests/PaymentRequests.WebhookReliability.Scenarios/**'
      - '.github/workflows/backend-request-webhook-reliability-1.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate webhook delivery attempt ledger and reliability metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Payment Request Webhooks
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Webhooks/PaymentRequests.Webhooks.csproj --configuration Release --nologo

      - name: Build webhook subscription persistence
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.WebhookSubscriptions.Persistence/PaymentRequests.WebhookSubscriptions.Persistence.csproj --configuration Release --nologo

      - name: Build IdentityService host composition
        run: dotnet build backend/src/IdentityService/IdentityService.Api/IdentityService.Api.csproj --configuration Release --nologo

      - name: Run Commit 7 webhook security scenarios
        run: dotnet run --project backend/tests/PaymentRequests.WebhookSecurity.Scenarios/PaymentRequests.WebhookSecurity.Scenarios.csproj --configuration Release

      - name: Run Commit 8 signed webhook HTTP scenarios
        run: dotnet run --project backend/tests/PaymentRequests.WebhookHttp.Scenarios/PaymentRequests.WebhookHttp.Scenarios.csproj --configuration Release

      - name: Run Commit 9 webhook registry scenarios
        run: dotnet run --project backend/tests/PaymentRequests.WebhookRegistry.Scenarios/PaymentRequests.WebhookRegistry.Scenarios.csproj --configuration Release

      - name: Run Commit 10 protected webhook management HTTP scenarios
        run: dotnet run --project backend/tests/PaymentRequests.WebhookManagement.Http.Scenarios/PaymentRequests.WebhookManagement.Http.Scenarios.csproj --configuration Release

      - name: Run Commit 11 webhook operations HTTP scenarios
        run: dotnet run --project backend/tests/PaymentRequests.WebhookOperations.Http.Scenarios/PaymentRequests.WebhookOperations.Http.Scenarios.csproj --configuration Release

      - name: Run Commit 12 webhook reliability scenarios
        run: dotnet run --project backend/tests/PaymentRequests.WebhookReliability.Scenarios/PaymentRequests.WebhookReliability.Scenarios.csproj --configuration Release
