name: AFW-BE-REQUEST Commit 7 Webhook Delivery Security

on:
  push:
    branches:
      - feature/backend-request-webhook-security-1
    paths:
      - 'backend/src/PaymentRequests/PaymentRequests.Webhooks/**'
      - 'backend/tests/PaymentRequests.WebhookSecurity.Scenarios/**'
      - 'docs/specs/payment-requests/webhook-receiver-contract.md'
      - '.github/workflows/backend-request-webhook-security-1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/PaymentRequests/PaymentRequests.Webhooks/**'
      - 'backend/tests/PaymentRequests.WebhookSecurity.Scenarios/**'
      - 'docs/specs/payment-requests/webhook-receiver-contract.md'
      - '.github/workflows/backend-request-webhook-security-1.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate webhook delivery security and receiver contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Payment Request Webhooks
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Webhooks/PaymentRequests.Webhooks.csproj --configuration Release --nologo

      - name: Run webhook security scenarios
        run: dotnet run --project backend/tests/PaymentRequests.WebhookSecurity.Scenarios/PaymentRequests.WebhookSecurity.Scenarios.csproj --configuration Release
