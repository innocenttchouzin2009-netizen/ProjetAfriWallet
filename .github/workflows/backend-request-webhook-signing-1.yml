name: AFW-BE-REQUEST-WEBHOOK-1 HMAC-SHA256 Webhook Signing Foundation

on:
  push:
    branches:
      - feature/backend-request-webhook-signing-1
    paths:
      - 'backend/src/PaymentRequests/**'
      - 'backend/tests/PaymentRequests.WebhookSigning.Scenarios/**'
      - '.github/workflows/backend-request-webhook-signing-1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/PaymentRequests/**'
      - 'backend/tests/PaymentRequests.WebhookSigning.Scenarios/**'
      - '.github/workflows/backend-request-webhook-signing-1.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate HMAC-SHA256 webhook signing foundation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Payment Requests Application
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Application/PaymentRequests.Application.csproj --configuration Release --nologo

      - name: Build Payment Requests Infrastructure
        run: dotnet build backend/src/PaymentRequests/PaymentRequests.Infrastructure/PaymentRequests.Infrastructure.csproj --configuration Release --nologo

      - name: Run HMAC-SHA256 webhook signing scenarios
        run: dotnet run --project backend/tests/PaymentRequests.WebhookSigning.Scenarios/PaymentRequests.WebhookSigning.Scenarios.csproj --configuration Release

      - name: Run lifecycle event contract regression scenarios
        run: dotnet run --project backend/tests/PaymentRequests.EventProduction.Scenarios/PaymentRequests.EventProduction.Scenarios.csproj --configuration Release

      - name: Run durable outbox regression scenarios
        run: dotnet run --project backend/tests/PaymentRequests.EventOutbox.Scenarios/PaymentRequests.EventOutbox.Scenarios.csproj --configuration Release

      - name: Run notification emission regression scenarios
        run: dotnet run --project backend/tests/Notifications.PaymentRequestEmission.Scenarios/Notifications.PaymentRequestEmission.Scenarios.csproj --configuration Release
