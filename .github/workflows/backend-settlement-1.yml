name: AFW-BE-SETTLEMENT-1 Durable Ledger-Backed Settlement Foundation

on:
  push:
    branches:
      - feature/backend-settlement-1
    paths:
      - 'backend/src/FinancialPlatform/Settlement/**'
      - 'backend/src/Ledger/**'
      - 'backend/src/Balance/**'
      - 'backend/src/Fx/**'
      - 'backend/tests/Settlement.Scenarios/**'
      - 'backend/tests/Settlement.LedgerBacked.Scenarios/**'
      - '.github/workflows/backend-settlement-1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/FinancialPlatform/Settlement/**'
      - 'backend/src/Ledger/**'
      - 'backend/src/Balance/**'
      - 'backend/src/Fx/**'
      - 'backend/tests/Settlement.Scenarios/**'
      - 'backend/tests/Settlement.LedgerBacked.Scenarios/**'
      - '.github/workflows/backend-settlement-1.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate durable ledger-backed settlement foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Settlement Application
        run: dotnet build backend/src/FinancialPlatform/Settlement/Settlement.Application/Settlement.Application.csproj --configuration Release --nologo

      - name: Build Settlement Infrastructure
        run: dotnet build backend/src/FinancialPlatform/Settlement/Settlement.Infrastructure/Settlement.Infrastructure.csproj --configuration Release --nologo

      - name: Build Settlement API
        run: dotnet build backend/src/FinancialPlatform/Settlement/Settlement.Api/Settlement.Api.csproj --configuration Release --nologo

      - name: Run legacy Settlement scenarios
        run: dotnet run --project backend/tests/Settlement.Scenarios/Settlement.Scenarios.csproj --configuration Release

      - name: Settlement.LedgerBacked.Scenarios
        run: dotnet run --project backend/tests/Settlement.LedgerBacked.Scenarios/Settlement.LedgerBacked.Scenarios.csproj --configuration Release
