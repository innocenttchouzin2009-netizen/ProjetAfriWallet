name: AFW-BE-TRANSACTION-HISTORY-1

on:
  push:
    branches:
      - feature/backend-transaction-history-1
    paths:
      - 'backend/src/TransactionHistory/**'
      - 'backend/tests/TransactionHistory.AuthorizedQuery.Scenarios/**'
      - '.github/workflows/backend-transaction-history-1.yml'
  pull_request:
    paths:
      - 'backend/src/TransactionHistory/**'
      - 'backend/tests/TransactionHistory.AuthorizedQuery.Scenarios/**'
      - '.github/workflows/backend-transaction-history-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transaction-history:
    name: Transaction History targeted gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Transaction History application
        run: dotnet restore backend/src/TransactionHistory/TransactionHistory.Application/TransactionHistory.Application.csproj

      - name: Restore authorized query scenarios
        run: dotnet restore backend/tests/TransactionHistory.AuthorizedQuery.Scenarios/TransactionHistory.AuthorizedQuery.Scenarios.csproj

      - name: Build Transaction History application
        run: dotnet build backend/src/TransactionHistory/TransactionHistory.Application/TransactionHistory.Application.csproj --configuration Release --no-restore

      - name: Run authorized query scenarios
        run: dotnet run --project backend/tests/TransactionHistory.AuthorizedQuery.Scenarios/TransactionHistory.AuthorizedQuery.Scenarios.csproj --configuration Release --no-restore

      - name: Diff check
        run: git diff --check
