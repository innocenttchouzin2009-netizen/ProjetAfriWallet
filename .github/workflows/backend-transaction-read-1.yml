name: AFW-BE-TRANSACTION-READ-1 Transaction Read Application

on:
  push:
    branches:
      - feature/backend-transaction-read-1
    paths:
      - 'backend/src/TransactionRead/**'
      - 'backend/tests/TransactionRead.Application.Scenarios/**'
      - '.github/workflows/backend-transaction-read-1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/TransactionRead/**'
      - 'backend/tests/TransactionRead.Application.Scenarios/**'
      - '.github/workflows/backend-transaction-read-1.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate TransactionRead Commit 2
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore
          dotnet restore backend/src/TransactionRead/TransactionRead.Application/TransactionRead.Application.csproj

      - name: Build TransactionRead Application
        run: dotnet build backend/src/TransactionRead/TransactionRead.Application/TransactionRead.Application.csproj --configuration Release --nologo --no-restore

      - name: Run TransactionRead Application scenarios
        run: dotnet run --project backend/tests/TransactionRead.Application.Scenarios --configuration Release

      - name: Diff check
        run: git diff --check
