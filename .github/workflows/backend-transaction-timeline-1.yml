name: AFW-BE-TRANSACTION-TIMELINE-1 Commit 1

on:
  push:
    branches:
      - feature/backend-transaction-timeline-1
    paths:
      - 'backend/src/TransactionTimeline/**'
      - 'backend/tests/TransactionTimeline.Projection.Scenarios/**'
      - '.github/workflows/backend-transaction-timeline-1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/TransactionTimeline/**'
      - 'backend/tests/TransactionTimeline.Projection.Scenarios/**'
      - '.github/workflows/backend-transaction-timeline-1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Transaction Timeline Commit 1
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore Transaction Timeline scenarios
        run: dotnet restore backend/tests/TransactionTimeline.Projection.Scenarios/TransactionTimeline.Projection.Scenarios.csproj

      - name: Build Transaction Timeline Application
        run: dotnet build backend/src/TransactionTimeline/TransactionTimeline.Application/TransactionTimeline.Application.csproj --configuration Release --no-restore --nologo

      - name: Run Transaction Timeline projection scenarios
        run: dotnet run --project backend/tests/TransactionTimeline.Projection.Scenarios/TransactionTimeline.Projection.Scenarios.csproj --configuration Release --no-restore

      - name: Verify Transaction Timeline Commit 1 diff
        run: git diff --check dc742bbc2169c07b8413a01b286779aff6bbc219..HEAD
