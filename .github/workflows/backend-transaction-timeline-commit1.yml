name: Transaction Timeline Commit 1 CI

on:
  push:
    branches:
      - feature/backend-transaction-timeline-1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Transaction Timeline Commit 1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore TransactionTimeline.Application
        run: >-
          dotnet restore
          backend/src/TransactionTimeline/TransactionTimeline.Application/TransactionTimeline.Application.csproj

      - name: Build TransactionTimeline.Application
        run: >-
          dotnet build
          backend/src/TransactionTimeline/TransactionTimeline.Application/TransactionTimeline.Application.csproj
          --configuration Release
          --no-restore

      - name: Verify diff hygiene from locked base
        run: git diff --check ef6e350a02c1acbad8b555153355bb2a3509c038...HEAD
