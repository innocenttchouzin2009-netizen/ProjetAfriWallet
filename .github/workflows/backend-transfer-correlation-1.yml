name: AFW-BE-TRANSFER-CORRELATION-1 Transfer Correlation Lookup

on:
  push:
    branches:
      - feature/backend-transfer-correlation-1
    paths:
      - 'backend/src/Transfer/**'
      - 'backend/src/IdentityService/IdentityService.Api/Transfer/**'
      - 'backend/tests/Transfer.Correlation.Scenarios/**'
      - 'backend/tests/Transfer.Correlation.Infrastructure.Scenarios/**'
      - 'backend/tests/Transfer.Correlation.Http.Scenarios/**'
      - '.github/workflows/backend-transfer-correlation-1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/Transfer/**'
      - 'backend/src/IdentityService/IdentityService.Api/Transfer/**'
      - 'backend/tests/Transfer.Correlation.Scenarios/**'
      - 'backend/tests/Transfer.Correlation.Infrastructure.Scenarios/**'
      - 'backend/tests/Transfer.Correlation.Http.Scenarios/**'
      - '.github/workflows/backend-transfer-correlation-1.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate AFW-BE-TRANSFER-CORRELATION-1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Transfer Application
        run: dotnet build backend/src/Transfer/Transfer.Application/Transfer.Application.csproj --configuration Release --nologo

      - name: Run correlation read-model scenarios
        run: dotnet run --project backend/tests/Transfer.Correlation.Scenarios/Transfer.Correlation.Scenarios.csproj --configuration Release

      - name: Build Transfer Infrastructure
        run: dotnet build backend/src/Transfer/Transfer.Infrastructure/Transfer.Infrastructure.csproj --configuration Release --nologo

      - name: Run ledger-backed receipt reader scenarios
        run: dotnet run --project backend/tests/Transfer.Correlation.Infrastructure.Scenarios/Transfer.Correlation.Infrastructure.Scenarios.csproj --configuration Release

      - name: Build Identity API with correlation receipt HTTP surface
        run: dotnet build backend/src/IdentityService/IdentityService.Api/IdentityService.Api.csproj --configuration Release --nologo

      - name: Run protected correlation receipt HTTP scenarios
        run: dotnet run --project backend/tests/Transfer.Correlation.Http.Scenarios/Transfer.Correlation.Http.Scenarios.csproj --configuration Release
