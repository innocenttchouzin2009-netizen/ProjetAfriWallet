name: AFW-BE-WEBHOOK-1 Partner Webhooks & External Event Delivery

on:
  push:
    branches:
      - feature/backend-webhook-1
      - feature/backend-webhook-routing-1
    paths:
      - 'backend/src/Webhooks/**'
      - 'backend/tests/PartnerWebhooks.Domain.Scenarios/**'
      - 'backend/tests/PartnerWebhooks.Application.Scenarios/**'
      - 'backend/tests/PartnerWebhooks.Persistence.Scenarios/**'
      - 'backend/tests/PartnerWebhooks.Signing.Scenarios/**'
      - 'backend/tests/PartnerWebhooks.Routing.Scenarios/**'
      - 'backend/tests/PartnerWebhooks.HttpDelivery.Scenarios/**'
      - '.github/workflows/backend-webhook-1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/Webhooks/**'
      - 'backend/tests/PartnerWebhooks.Domain.Scenarios/**'
      - 'backend/tests/PartnerWebhooks.Application.Scenarios/**'
      - 'backend/tests/PartnerWebhooks.Persistence.Scenarios/**'
      - 'backend/tests/PartnerWebhooks.Signing.Scenarios/**'
      - 'backend/tests/PartnerWebhooks.Routing.Scenarios/**'
      - 'backend/tests/PartnerWebhooks.HttpDelivery.Scenarios/**'
      - '.github/workflows/backend-webhook-1.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate AFW-BE-WEBHOOK-1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Partner Webhooks Domain
        run: dotnet build backend/src/Webhooks/PartnerWebhooks.Domain/PartnerWebhooks.Domain.csproj --configuration Release --nologo

      - name: Run partner webhook domain scenarios
        run: dotnet run --project backend/tests/PartnerWebhooks.Domain.Scenarios/PartnerWebhooks.Domain.Scenarios.csproj --configuration Release

      - name: Build Partner Webhooks Application
        run: dotnet build backend/src/Webhooks/PartnerWebhooks.Application/PartnerWebhooks.Application.csproj --configuration Release --nologo

      - name: Run partner webhook application scenarios
        run: dotnet run --project backend/tests/PartnerWebhooks.Application.Scenarios/PartnerWebhooks.Application.Scenarios.csproj --configuration Release

      - name: Build Partner Webhooks Persistence
        run: dotnet build backend/src/Webhooks/PartnerWebhooks.Persistence/PartnerWebhooks.Persistence.csproj --configuration Release --nologo

      - name: Run partner webhook persistence scenarios
        run: dotnet run --project backend/tests/PartnerWebhooks.Persistence.Scenarios/PartnerWebhooks.Persistence.Scenarios.csproj --configuration Release

      - name: Run canonical webhook envelope and signing scenarios
        run: dotnet run --project backend/tests/PartnerWebhooks.Signing.Scenarios/PartnerWebhooks.Signing.Scenarios.csproj --configuration Release

      - name: Run subscription-aware webhook routing scenarios
        run: dotnet run --project backend/tests/PartnerWebhooks.Routing.Scenarios/PartnerWebhooks.Routing.Scenarios.csproj --configuration Release

      - name: Build Partner Webhooks Infrastructure
        run: dotnet build backend/src/Webhooks/PartnerWebhooks.Infrastructure/PartnerWebhooks.Infrastructure.csproj --configuration Release --nologo

      - name: Run signed HTTP delivery per subscription scenarios
        run: dotnet run --project backend/tests/PartnerWebhooks.HttpDelivery.Scenarios/PartnerWebhooks.HttpDelivery.Scenarios.csproj --configuration Release
