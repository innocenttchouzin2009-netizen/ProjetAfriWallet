name: AFW-BE-WEBHOOK-MGMT-1 Webhook Management

on:
  push:
    branches:
      - feature/backend-webhook-management-1
    paths:
      - 'backend/src/WebhookManagement/**'
      - 'backend/tests/WebhookManagement.Domain.Scenarios/**'
      - 'backend/tests/WebhookManagement.Application.Scenarios/**'
      - 'backend/tests/WebhookManagement.Persistence.Scenarios/**'
      - 'backend/src/IdentityService/IdentityService.Api/Webhooks/**'
      - 'backend/src/IdentityService/IdentityService.Api/Program.cs'
      - 'backend/src/IdentityService/IdentityService.Api/IdentityService.Api.csproj'
      - 'backend/src/IdentityService/IdentityService.Api/appsettings.json'
      - 'backend/tests/WebhookManagement.Http.Scenarios/**'
      - '.github/workflows/backend-webhook-management-1.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/WebhookManagement/**'
      - 'backend/tests/WebhookManagement.Domain.Scenarios/**'
      - 'backend/tests/WebhookManagement.Application.Scenarios/**'
      - 'backend/tests/WebhookManagement.Persistence.Scenarios/**'
      - 'backend/src/IdentityService/IdentityService.Api/Webhooks/**'
      - 'backend/src/IdentityService/IdentityService.Api/Program.cs'
      - 'backend/src/IdentityService/IdentityService.Api/IdentityService.Api.csproj'
      - 'backend/src/IdentityService/IdentityService.Api/appsettings.json'
      - 'backend/tests/WebhookManagement.Http.Scenarios/**'
      - '.github/workflows/backend-webhook-management-1.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate AFW-BE-WEBHOOK-MGMT-1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Webhook Management Domain
        run: dotnet build backend/src/WebhookManagement/WebhookManagement.Domain/WebhookManagement.Domain.csproj --configuration Release --nologo

      - name: Run webhook management domain scenarios
        run: dotnet run --project backend/tests/WebhookManagement.Domain.Scenarios/WebhookManagement.Domain.Scenarios.csproj --configuration Release

      - name: Build Webhook Management Application
        run: dotnet build backend/src/WebhookManagement/WebhookManagement.Application/WebhookManagement.Application.csproj --configuration Release --nologo

      - name: Run webhook management application scenarios
        run: dotnet run --project backend/tests/WebhookManagement.Application.Scenarios/WebhookManagement.Application.Scenarios.csproj --configuration Release

      - name: Build Webhook Management Persistence
        run: dotnet build backend/src/WebhookManagement/WebhookManagement.Persistence/WebhookManagement.Persistence.csproj --configuration Release --nologo

      - name: Run webhook management persistence scenarios
        run: dotnet run --project backend/tests/WebhookManagement.Persistence.Scenarios/WebhookManagement.Persistence.Scenarios.csproj --configuration Release

      - name: Build IdentityService host with Webhook Management wiring
        run: dotnet build backend/src/IdentityService/IdentityService.Api/IdentityService.Api.csproj --configuration Release --nologo

      - name: Run protected webhook management HTTP scenarios
        run: dotnet run --project backend/tests/WebhookManagement.Http.Scenarios/WebhookManagement.Http.Scenarios.csproj --configuration Release
