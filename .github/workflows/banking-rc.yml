name: banking-rc

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/src/BankingPlatform/**"
      - "backend/tests/**"
      - "tools/release/*banking*.ps1"
      - "docs/specs/banking-release-candidate/**"
      - "release/banking-platform/v1.5.0-rc1/**"
      - ".github/workflows/banking-rc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  banking-rc:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Banking RC gate
        shell: pwsh
        run: |
          ./tools/release/build-banking-release.ps1 -Configuration Release

      - name: Git diff check
        shell: pwsh
        run: |
          git diff --check
