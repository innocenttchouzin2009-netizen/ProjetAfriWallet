name: dispute-intelligence

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/Disputes/DisputeIntelligence/**'
      - 'backend/tests/DisputeIntelligence.Scenarios/**'
      - 'tools/release/validate-dispute-intelligence.ps1'
      - 'tools/release/scan-dispute-intelligence-secrets.ps1'
      - 'docs/specs/dispute-intelligence/**'
      - '.github/workflows/dispute-intelligence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispute-intelligence:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate AFW-DLV-0018.6
        shell: pwsh
        run: ./tools/release/validate-dispute-intelligence.ps1 -Configuration Release
      - name: Verify diff
        shell: pwsh
        run: git diff --check
