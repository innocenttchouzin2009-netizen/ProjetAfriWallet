name: dispute-investigation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/Disputes/DisputeInvestigation.**/**'
      - 'backend/tests/DisputeInvestigation.Scenarios/**'
      - 'tools/release/validate-dispute-investigation.ps1'
      - 'tools/release/scan-dispute-investigation-secrets.ps1'
      - 'docs/specs/dispute-investigation/**'
      - '.github/workflows/dispute-investigation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispute-investigation:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate AFW-DLV-0018.3
        shell: pwsh
        run: ./tools/release/validate-dispute-investigation.ps1 -Configuration Release
      - name: Git diff check
        shell: pwsh
        run: git diff --check
