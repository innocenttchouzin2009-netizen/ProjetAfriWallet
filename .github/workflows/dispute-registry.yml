name: dispute-registry

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/Disputes/DisputeRegistry.**/**'
      - 'backend/tests/DisputeRegistry.Scenarios/**'
      - 'tools/release/validate-dispute-registry.ps1'
      - 'tools/release/scan-dispute-registry-secrets.ps1'
      - 'docs/specs/dispute-registry/**'
      - '.github/workflows/dispute-registry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispute-registry:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate AFW-DLV-0018.1
        shell: pwsh
        run: ./tools/release/validate-dispute-registry.ps1 -Configuration Release
      - name: Verify git diff
        shell: pwsh
        run: git diff --check
