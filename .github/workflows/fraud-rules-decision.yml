name: fraud-rules-decision

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/Fraud/FraudDecision.**/**'
      - 'backend/tests/FraudDecision.Scenarios/**'
      - 'tools/release/validate-fraud-decision.ps1'
      - 'tools/release/scan-fraud-decision-secrets.ps1'
      - 'docs/specs/fraud-rules-decision/**'
      - '.github/workflows/fraud-rules-decision.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fraud-rules-decision:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate AFW-DLV-0017.4
        shell: pwsh
        run: ./tools/release/validate-fraud-decision.ps1 -Configuration Release
      - name: Verify git diff
        shell: pwsh
        run: git diff --check