name: identity-verification

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/src/Compliance/IdentityVerification.**/**"
      - "backend/tests/IdentityVerification.Scenarios/**"
      - "tools/release/validate-identity-verification.ps1"
      - "tools/release/scan-identity-verification-secrets.ps1"
      - "docs/specs/identity-verification/**"
      - ".github/workflows/identity-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-verification:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Validate AFW-DLV-0016.2
        shell: pwsh
        run: |
          ./tools/release/validate-identity-verification.ps1 -Configuration Release

      - name: Verify git diff
        shell: pwsh
        run: |
          git diff --check
