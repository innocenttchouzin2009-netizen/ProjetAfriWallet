name: merchant-checkout
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/src/Merchants/MerchantCheckout/**'
      - 'backend/tests/MerchantCheckout.Scenarios/**'
      - 'tools/release/validate-merchant-checkout.ps1'
      - 'tools/release/scan-merchant-checkout-secrets.ps1'
      - 'docs/specs/merchant-checkout/**'
      - '.github/workflows/merchant-checkout.yml'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  merchant-checkout:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - shell: pwsh
        run: ./tools/release/validate-merchant-checkout.ps1 -Configuration Release
      - shell: pwsh
        run: git diff --check
