name: merchant-payment-decision
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/src/Merchants/MerchantPaymentDecision/**'
      - 'backend/tests/MerchantPaymentDecision.Scenarios/**'
      - 'tools/release/validate-merchant-payment-decision.ps1'
      - 'tools/release/scan-merchant-payment-decision-secrets.ps1'
      - 'docs/specs/merchant-payment-decision/**'
      - '.github/workflows/merchant-payment-decision.yml'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  merchant-payment-decision:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - shell: pwsh
        run: ./tools/release/validate-merchant-payment-decision.ps1 -Configuration Release
      - shell: pwsh
        run: git diff --check
