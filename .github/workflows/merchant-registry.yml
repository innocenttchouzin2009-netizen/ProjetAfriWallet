name: merchant-registry

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/Merchants/**'
      - 'backend/tests/MerchantRegistry.Scenarios/**'
      - 'tools/release/validate-merchant-registry.ps1'
      - 'tools/release/scan-merchant-registry-secrets.ps1'
      - 'docs/specs/merchant-registry/**'
      - '.github/workflows/merchant-registry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merchant-registry:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate AFW-DLV-0019.1
        shell: pwsh
        run: |
          ./tools/release/validate-merchant-registry.ps1 -Configuration Release
      - name: Verify diff
        shell: pwsh
        run: |
          git diff --check
