name: merchant-verification

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/Merchants/MerchantOnboarding/**'
      - 'backend/tests/MerchantVerification.Scenarios/**'
      - 'tools/release/validate-merchant-verification.ps1'
      - 'tools/release/scan-merchant-verification-secrets.ps1'
      - 'docs/specs/merchant-verification/**'
      - '.github/workflows/merchant-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merchant-verification:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate AFW-DLV-0019.2
        shell: pwsh
        run: |
          ./tools/release/validate-merchant-verification.ps1 -Configuration Release
      - name: Verify diff
        shell: pwsh
        run: |
          git diff --check
