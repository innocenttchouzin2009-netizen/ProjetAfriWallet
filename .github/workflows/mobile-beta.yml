name: mobile-beta

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile_app/**'
      - 'docs/mobile/**'
      - '.github/workflows/mobile-beta.yml'
  workflow_dispatch:

jobs:
  flutter-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Diff check
        working-directory: .
        run: git diff --check
