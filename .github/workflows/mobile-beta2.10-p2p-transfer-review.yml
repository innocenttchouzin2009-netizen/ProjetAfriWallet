name: Mobile Beta2.10 P2P Transfer Review

on:
  push:
    branches:
      - feature/mobile-beta2.10
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'push' || github.head_ref == 'feature/mobile-beta2.10'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/mobile_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify lockfile is synchronized
        run: git diff --exit-code -- pubspec.lock

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test P2P transfer review and confirmation
        run: flutter test test/send_receive_page_test.dart test/p2p_transfer_review_page_test.dart test/transfer_repository_test.dart

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Verify Beta2.10 diff
        working-directory: .
        run: git diff --check 76bbf44bd6ee2ac4165ceca51d05e54c2c9c0f88..HEAD
