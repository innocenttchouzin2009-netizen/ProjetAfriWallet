name: Mobile Beta2.13 Auth Session Gate

on:
  push:
    branches:
      - feature/mobile-beta2.13-auth-app-bootstrap-session-gate
    paths:
      - 'apps/mobile_app/lib/models/auth_*.dart'
      - 'apps/mobile_app/lib/models/current_auth_session.dart'
      - 'apps/mobile_app/lib/network/api_client.dart'
      - 'apps/mobile_app/lib/services/auth_*.dart'
      - 'apps/mobile_app/lib/services/secure_session_store.dart'
      - 'apps/mobile_app/lib/services/secure_storage_adapter.dart'
      - 'apps/mobile_app/lib/widgets/auth_session_gate.dart'
      - 'apps/mobile_app/test/auth_session_gate_test.dart'
      - 'apps/mobile_app/test/auth_state_controller_test.dart'
      - 'apps/mobile_app/test/auth_session_coordinator_test.dart'
      - 'apps/mobile_app/test/auth_production_wiring_test.dart'
      - 'apps/mobile_app/pubspec.yaml'
      - 'apps/mobile_app/pubspec.lock'
      - '.github/workflows/mobile-beta2.13-auth-session-gate.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/mobile_app/lib/models/auth_*.dart'
      - 'apps/mobile_app/lib/models/current_auth_session.dart'
      - 'apps/mobile_app/lib/network/api_client.dart'
      - 'apps/mobile_app/lib/services/auth_*.dart'
      - 'apps/mobile_app/lib/services/secure_session_store.dart'
      - 'apps/mobile_app/lib/services/secure_storage_adapter.dart'
      - 'apps/mobile_app/lib/widgets/auth_session_gate.dart'
      - 'apps/mobile_app/test/auth_session_gate_test.dart'
      - 'apps/mobile_app/test/auth_state_controller_test.dart'
      - 'apps/mobile_app/test/auth_session_coordinator_test.dart'
      - 'apps/mobile_app/test/auth_production_wiring_test.dart'
      - 'apps/mobile_app/pubspec.yaml'
      - 'apps/mobile_app/pubspec.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: apps/mobile_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test auth session gate
        run: flutter test test/auth_session_gate_test.dart

      - name: Test auth state controller
        run: flutter test test/auth_state_controller_test.dart

      - name: Test auth session coordinator
        run: flutter test test/auth_session_coordinator_test.dart

      - name: Test auth production wiring
        run: flutter test test/auth_production_wiring_test.dart

      - name: Verify Beta2.13 diff
        working-directory: .
        run: git diff --check 9718a1cc762139145b031dbed208e4f82140093f...HEAD