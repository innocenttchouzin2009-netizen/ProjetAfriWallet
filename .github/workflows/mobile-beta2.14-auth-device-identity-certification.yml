name: Mobile Beta2.14 Auth Device Identity Certification

on:
  push:
    branches:
      - ci/mobile-beta2.14-auth-device-identity-certification
    paths:
      - '.github/workflows/mobile-beta2.14-auth-device-identity-certification.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CANDIDATE_SHA: ccb9e4fd9bc2f5b0fb50633ff65ed665de7e109c
      BASE_SHA: 766ac870fd887c7628dc72361992c7fcb2bf6586
      STATUS_CONTEXT: mobile-beta2.14/auth-device-identity-certification

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Assert exact candidate lineage
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$CANDIDATE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$CANDIDATE_SHA^{commit}"
          git merge-base --is-ancestor "$BASE_SHA" "$CANDIDATE_SHA"

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile_app
        run: flutter pub get

      - name: Generate localizations
        working-directory: apps/mobile_app
        run: flutter gen-l10n

      - name: Flutter analyze
        working-directory: apps/mobile_app
        run: flutter analyze

      - name: Test auth device identity
        working-directory: apps/mobile_app
        run: flutter test test/auth_device_identity_test.dart

      - name: Test targeted auth and session suite
        working-directory: apps/mobile_app
        run: |
          flutter test \
            test/auth_contract_test.dart \
            test/auth_repository_remote_data_source_test.dart \
            test/auth_session_coordinator_test.dart \
            test/auth_session_gate_test.dart \
            test/auth_session_store_test.dart \
            test/auth_state_controller_test.dart \
            test/secure_session_store_test.dart \
            test/auth_production_wiring_test.dart

      - name: Git diff check
        shell: bash
        run: git diff --check "$BASE_SHA...$CANDIDATE_SHA"

      - name: Report certification status
        if: always()
        uses: actions/github-script@v7
        env:
          CERTIFICATION_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const succeeded = process.env.CERTIFICATION_JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.CANDIDATE_SHA,
              state: succeeded ? 'success' : 'failure',
              context: process.env.STATUS_CONTEXT,
              description: succeeded
                ? 'Auth device identity candidate certified'
                : 'Auth device identity candidate certification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
