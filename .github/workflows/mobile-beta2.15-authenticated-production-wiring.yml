name: Mobile Beta2.15 Authenticated Production Wiring Certification

on:
  push:
    branches:
      - feature/mobile-beta2.15-authenticated-production-wiring
    paths:
      - '.github/workflows/mobile-beta2.15-authenticated-production-wiring.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      CANDIDATE_SHA: c1ea68dd1e296f5712b2dc40b808f77bd78709c2
      BASE_SHA: 2d044c3c7a366e8fec4d7f0dce1ebd545e2cdb0a
      STATUS_CONTEXT: mobile-beta2.15/authenticated-production-wiring

    defaults:
      run:
        working-directory: apps/mobile_app

    steps:
      - name: Checkout exact Beta2.15 functional commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Assert exact candidate lineage
        id: candidate_assertion
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${CANDIDATE_SHA}"
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          git cat-file -e "${BASE_SHA}^{commit}"
          git merge-base --is-ancestor "${BASE_SHA}" "${CANDIDATE_SHA}"

      - name: Mark certification pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.CANDIDATE_SHA,
              state: 'pending',
              context: process.env.STATUS_CONTEXT,
              description: 'Beta2.15 production wiring certification in progress',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test authenticated production wiring
        run: flutter test test/authenticated_production_wiring_test.dart

      - name: Test Auth integration surface
        run: |
          flutter test \
            test/auth_contract_test.dart \
            test/auth_production_wiring_test.dart \
            test/auth_repository_remote_data_source_test.dart \
            test/auth_session_coordinator_test.dart \
            test/auth_session_gate_test.dart \
            test/auth_session_store_test.dart \
            test/auth_state_controller_test.dart

      - name: Test Wallet integration surface
        run: |
          flutter test \
            test/wallet_production_wiring_test.dart \
            test/wallet_remote_data_source_test.dart \
            test/wallet_repository_test.dart \
            test/wallet_home_page_test.dart

      - name: Test P2P integration surface
        run: |
          flutter test \
            test/p2p_remote_data_source_test.dart \
            test/transfer_repository_test.dart \
            test/send_receive_page_test.dart \
            test/p2p_transfer_review_page_test.dart

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Verify Beta2.15 functional diff
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${BASE_SHA}...${CANDIDATE_SHA}"

      - name: Write certification summary
        if: always()
        working-directory: .
        shell: bash
        run: |
          {
            echo "## Mobile Beta2.15 authenticated production wiring certification"
            echo
            echo "- Candidate: \`${CANDIDATE_SHA}\`"
            echo "- Base: \`${BASE_SHA}\`"
            echo "- Job status: **${{ job.status }}**"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Report certification status
        if: always() && steps.candidate_assertion.outcome == 'success'
        uses: actions/github-script@v7
        env:
          CERTIFICATION_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const succeeded = process.env.CERTIFICATION_JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.CANDIDATE_SHA,
              state: succeeded ? 'success' : 'failure',
              context: process.env.STATUS_CONTEXT,
              description: succeeded
                ? 'Beta2.15 production wiring certified'
                : 'Beta2.15 production wiring certification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
