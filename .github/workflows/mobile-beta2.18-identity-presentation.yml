name: Mobile Beta2.18 Identity Presentation Contract Migration

on:
  push:
    branches:
      - feature/mobile-beta2.18
    paths:
      - '.github/workflows/mobile-beta2.18-identity-presentation.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      CANDIDATE_SHA: 80eefec072a5d66c9158ec2318e898696305a15a
      BASE_SHA: 04a989c9654c472a725ed8f6b040829e3ad3c723
      STATUS_CONTEXT: mobile-beta2.18/identity-presentation

    defaults:
      run:
        working-directory: apps/mobile_app

    steps:
      - name: Checkout exact Beta2.18 identity presentation commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Assert exact candidate lineage
        id: candidate_assertion
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${CANDIDATE_SHA}"
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          git cat-file -e "${BASE_SHA}^{commit}"
          git merge-base --is-ancestor "${BASE_SHA}" "${CANDIDATE_SHA}"

      - name: Mark certification pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.CANDIDATE_SHA,
              state: 'pending',
              context: process.env.STATUS_CONTEXT,
              description: 'Beta2.18 identity presentation certification in progress',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test identity presentation page
        run: flutter test test/identity_awid_page_test.dart

      - name: Test authenticated production wiring
        run: flutter test test/authenticated_production_wiring_test.dart

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Verify Beta2.18 functional diff
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${BASE_SHA}...${CANDIDATE_SHA}"

      - name: Write certification summary
        if: always()
        working-directory: .
        shell: bash
        run: |
          {
            echo "## Mobile Beta2.18 identity presentation certification"
            echo
            echo "- Candidate: `${CANDIDATE_SHA}`"
            echo "- Base: `${BASE_SHA}`"
            echo "- Job status: **${{ job.status }}**"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Report certification status
        if: always() && steps.candidate_assertion.outcome == 'success'
        uses: actions/github-script@v7
        env:
          CERTIFICATION_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const succeeded = process.env.CERTIFICATION_JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.CANDIDATE_SHA,
              state: succeeded ? 'success' : 'failure',
              context: process.env.STATUS_CONTEXT,
              description: succeeded
                ? 'Beta2.18 identity presentation certified'
                : 'Beta2.18 identity presentation certification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
