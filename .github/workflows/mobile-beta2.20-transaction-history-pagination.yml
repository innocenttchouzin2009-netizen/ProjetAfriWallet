name: Mobile Beta2.20 Commit 3 Pagination UI Integration Certification

on:
  push:
    branches:
      - feature/mobile-beta2.20
    paths:
      - '.github/workflows/mobile-beta2.20-transaction-history-pagination.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CANDIDATE_SHA: 3dd964a980494a773f199117214431b21dda5496
      BASE_SHA: 61c0b0a36255ed5e932eaecb2416f7fb4a3dc0f6
      STATUS_CONTEXT: mobile-beta2.20/commit3-pagination-ui

    defaults:
      run:
        working-directory: apps/mobile_app

    steps:
      - name: Checkout exact Beta2.20 Commit 3 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Assert exact Commit 3 lineage
        id: candidate_assertion
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${CANDIDATE_SHA}"
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          git cat-file -e "${BASE_SHA}^{commit}"
          test "$(git rev-parse "${CANDIDATE_SHA}^")" = "${BASE_SHA}"

      - name: Mark certification pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.CANDIDATE_SHA,
              state: 'pending',
              context: process.env.STATUS_CONTEXT,
              description: 'Beta2.20 Commit 3 certification in progress',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test pagination UI integration
        run: flutter test test/transaction_history_page_test.dart

      - name: Test pagination controller
        run: flutter test test/transaction_history_pagination_controller_test.dart

      - name: Test transaction history repository
        run: flutter test test/transaction_history_repository_test.dart

      - name: Test transaction history remote data source
        run: flutter test test/transaction_history_remote_data_source_test.dart

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Verify Beta2.20 Commit 3 diff
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${BASE_SHA}..${CANDIDATE_SHA}"

      - name: Write certification summary
        if: always()
        working-directory: .
        shell: bash
        run: |
          {
            echo "## Mobile Beta2.20 Commit 3 certification"
            echo
            echo "- Candidate: \`${CANDIDATE_SHA}\`"
            echo "- Parent/base: \`${BASE_SHA}\`"
            echo "- Analyze: \`flutter analyze\`"
            echo "- Pagination UI: \`transaction_history_page_test.dart\`"
            echo "- Pagination controller: \`transaction_history_pagination_controller_test.dart\`"
            echo "- Repository: \`transaction_history_repository_test.dart\`"
            echo "- Remote data source: \`transaction_history_remote_data_source_test.dart\`"
            echo "- Full suite: \`flutter test\`"
            echo "- Diff check: \`git diff --check ${BASE_SHA}..${CANDIDATE_SHA}\`"
            echo "- Job status: **${{ job.status }}**"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Report certification status
        if: always() && steps.candidate_assertion.outcome == 'success'
        uses: actions/github-script@v7
        env:
          CERTIFICATION_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const succeeded = process.env.CERTIFICATION_JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.CANDIDATE_SHA,
              state: succeeded ? 'success' : 'failure',
              context: process.env.STATUS_CONTEXT,
              description: succeeded
                ? 'Beta2.20 Commit 3 certified'
                : 'Beta2.20 Commit 3 certification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
