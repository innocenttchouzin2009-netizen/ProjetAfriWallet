name: Mobile Beta2.21 Commit 2 QR Payment Repository Certification

on:
  push:
    branches:
      - feature/mobile-beta2.21
    paths:
      - '.github/workflows/mobile-beta2.21-qr-payment-repository.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BASE_SHA: 47aa8fa593fa195b106413c5e04c9180f23ab030
      CANDIDATE_SHA: 116b114d90e88193bf77502ca217d9cfee704e50
      STATUS_CONTEXT: mobile-beta2.21/commit2-qr-payment-repository

    defaults:
      run:
        working-directory: apps/mobile_app

    steps:
      - name: Checkout exact Beta2.21 Commit 2 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Assert exact Commit 2 lineage
        id: candidate_assertion
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${CANDIDATE_SHA}"
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          git cat-file -e "${BASE_SHA}^{commit}"
          test "$(git rev-parse "${CANDIDATE_SHA}^")" = "${BASE_SHA}"

      - name: Mark certification pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.CANDIDATE_SHA,
              state: 'pending',
              context: process.env.STATUS_CONTEXT,
              description: 'Beta2.21 Commit 2 certification in progress',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test QR payment remote data source
        run: flutter test test/qr_payment_remote_data_source_test.dart

      - name: Test QR payment repository
        run: flutter test test/qr_payment_repository_test.dart

      - name: Test authenticated production wiring
        run: flutter test test/authenticated_production_wiring_test.dart

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Verify Beta2.21 Commit 2 diff
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${BASE_SHA}..${CANDIDATE_SHA}"

      - name: Write certification summary
        if: always()
        working-directory: .
        shell: bash
        run: |
          {
            echo "## Mobile Beta2.21 Commit 2 certification"
            echo
            echo "- Base: \`${BASE_SHA}\`"
            echo "- Candidate: \`${CANDIDATE_SHA}\`"
            echo "- Analyze: \`flutter analyze\`"
            echo "- Remote data source: \`qr_payment_remote_data_source_test.dart\`"
            echo "- Repository: \`qr_payment_repository_test.dart\`"
            echo "- Production wiring: \`authenticated_production_wiring_test.dart\`"
            echo "- Full suite: \`flutter test\`"
            echo "- Diff check: \`git diff --check ${BASE_SHA}..${CANDIDATE_SHA}\`"
            echo "- Job status: **${{ job.status }}**"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Report certification status
        if: always() && steps.candidate_assertion.outcome == 'success'
        uses: actions/github-script@v7
        env:
          CERTIFICATION_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const succeeded = process.env.CERTIFICATION_JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.CANDIDATE_SHA,
              state: succeeded ? 'success' : 'failure',
              context: process.env.STATUS_CONTEXT,
              description: succeeded
                ? 'Beta2.21 Commit 2 certified'
                : 'Beta2.21 Commit 2 certification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
