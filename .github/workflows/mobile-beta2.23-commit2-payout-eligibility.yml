name: Mobile Beta2.23 Commit 2 Payout Eligibility Certification

on:
  push:
    branches:
      - ci/mobile-beta2.23-commit2-certification
    paths:
      - '.github/workflows/mobile-beta2.23-commit2-payout-eligibility.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CANDIDATE_SHA: c1ff7cb29a2dddfbe84a2f7c0c5a0d4bbad2d260
      BASE_SHA: 19cfe04f86637b1b50e585beb7602f07bc195d48
      STATUS_CONTEXT: mobile-beta2.23/commit2-payout-eligibility

    defaults:
      run:
        working-directory: apps/mobile_app

    steps:
      - name: Checkout exact Beta2.23 Commit 2 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Assert exact Commit 2 lineage
        id: candidate_assertion
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${CANDIDATE_SHA}"
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          git cat-file -e "${BASE_SHA}^{commit}"
          test "$(git rev-parse "${CANDIDATE_SHA}^")" = "${BASE_SHA}"

      - name: Mark certification pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.CANDIDATE_SHA,
              state: 'pending',
              context: process.env.STATUS_CONTEXT,
              description: 'Beta2.23 Commit 2 certification in progress',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test Commit 1 payout eligibility contract
        run: flutter test test/mobile_money_payout_eligibility_contract_test.dart

      - name: Test Commit 2 payout eligibility remote data source
        run: flutter test test/mobile_money_payout_eligibility_remote_data_source_test.dart

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Verify Commit 2 diff
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${BASE_SHA}..${CANDIDATE_SHA}"

      - name: Write certification summary
        if: always()
        working-directory: .
        shell: bash
        run: |
          {
            echo "## Mobile Beta2.23 Commit 2 certification"
            echo
            echo "- Candidate: \`${CANDIDATE_SHA}\`"
            echo "- Parent/base: \`${BASE_SHA}\`"
            echo "- Analyze: \`flutter analyze\`"
            echo "- Commit 1 contract test: \`mobile_money_payout_eligibility_contract_test.dart\`"
            echo "- Commit 2 remote data source test: \`mobile_money_payout_eligibility_remote_data_source_test.dart\`"
            echo "- Full suite: \`flutter test\`"
            echo "- Diff check: \`git diff --check ${BASE_SHA}..${CANDIDATE_SHA}\`"
            echo "- Job status: **${{ job.status }}**"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Report certification status
        if: always() && steps.candidate_assertion.outcome == 'success'
        uses: actions/github-script@v7
        env:
          CERTIFICATION_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const succeeded = process.env.CERTIFICATION_JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.CANDIDATE_SHA,
              state: succeeded ? 'success' : 'failure',
              context: process.env.STATUS_CONTEXT,
              description: succeeded
                ? 'Beta2.23 Commit 2 certified'
                : 'Beta2.23 Commit 2 certification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
