name: Mobile Beta2.23 Commit 3 Mobile Money Payout Repository Certification

on:
  push:
    branches:
      - ci/mobile-beta2.23-commit3-certification
    paths:
      - '.github/workflows/mobile-beta2.23-mobile-money-payout-repository.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CANDIDATE_SHA: c0727f78380705c25d4289696de1fa973f6e5fb2
      BASE_SHA: cdd6f64af5909f47d31349802ea2f418e617b9c8
      STATUS_CONTEXT: mobile-beta2.23/commit3-mobile-money-payout-repository

    defaults:
      run:
        working-directory: apps/mobile_app

    steps:
      - name: Checkout exact Beta2.23 Commit 3 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Assert exact Commit 3 lineage
        id: candidate_assertion
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${CANDIDATE_SHA}"
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          git cat-file -e "${BASE_SHA}^{commit}"
          test "$(git rev-parse "${CANDIDATE_SHA}^")" = "${BASE_SHA}"

      - name: Mark certification pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.CANDIDATE_SHA,
              state: 'pending',
              context: process.env.STATUS_CONTEXT,
              description: 'Beta2.23 Commit 3 certification in progress',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test Mobile Money payout repository
        run: flutter test test/mobile_money_payout_repository_test.dart

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Verify Commit 3 diff
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${BASE_SHA}..${CANDIDATE_SHA}"

      - name: Write certification summary
        if: always()
        working-directory: .
        shell: bash
        run: |
          {
            echo "## Mobile Beta2.23 Commit 3 certification"
            echo
            echo "- Candidate: \`${CANDIDATE_SHA}\`"
            echo "- Parent/base: \`${BASE_SHA}\`"
            echo "- Analyze: \`flutter analyze\`"
            echo "- Targeted test: \`mobile_money_payout_repository_test.dart\`"
            echo "- Full suite: \`flutter test\`"
            echo "- Diff check: \`git diff --check ${BASE_SHA}..${CANDIDATE_SHA}\`"
            echo "- Job status: **${{ job.status }}**"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Report certification status
        if: always() && steps.candidate_assertion.outcome == 'success'
        uses: actions/github-script@v7
        env:
          CERTIFICATION_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const succeeded = process.env.CERTIFICATION_JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.CANDIDATE_SHA,
              state: succeeded ? 'success' : 'failure',
              context: process.env.STATUS_CONTEXT,
              description: succeeded
                ? 'Beta2.23 Commit 3 certified'
                : 'Beta2.23 Commit 3 certification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
