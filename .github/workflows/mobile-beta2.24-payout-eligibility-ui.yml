name: Mobile Beta2.24 Payout Eligibility UI Certification

on:
  push:
    branches:
      - cert/mobile-beta2.24-final
    paths:
      - '.github/workflows/mobile-beta2.24-payout-eligibility-ui.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CANDIDATE_SHA: 530b079a7c81c705a55e8318c0ac034f34904b68
      BASE_SHA: 4757c86837145e1740309781e53c8cfc0603dab5
      STATUS_CONTEXT: mobile-beta2.24/payout-eligibility-ui

    defaults:
      run:
        working-directory: apps/mobile_app

    steps:
      - name: Checkout exact UI integration candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Assert exact candidate lineage
        id: candidate_assertion
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${CANDIDATE_SHA}"
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          git cat-file -e "${BASE_SHA}^{commit}"
          test "$(git merge-base "${BASE_SHA}" "${CANDIDATE_SHA}")" = "${BASE_SHA}"
          test "$(git rev-list --count "${BASE_SHA}..${CANDIDATE_SHA}")" = "8"

      - name: Mark certification pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.CANDIDATE_SHA,
              state: 'pending',
              context: process.env.STATUS_CONTEXT,
              description: 'Beta2.24 payout eligibility UI certification in progress',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test payout eligibility controller
        run: flutter test test/mobile_money_payout_eligibility_controller_test.dart

      - name: Test payout eligibility widget
        run: flutter test test/mobile_money_payout_eligibility_page_test.dart

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Verify UI integration diff
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${BASE_SHA}..${CANDIDATE_SHA}"

      - name: Write certification summary
        if: always()
        working-directory: .
        shell: bash
        run: |
          {
            echo "## Mobile Beta2.24 payout eligibility UI certification"
            echo
            echo "- Candidate: `${CANDIDATE_SHA}`"
            echo "- Parent/base: `${BASE_SHA}`"
            echo "- Lineage count: `8`"
            echo "- Analyze: `flutter analyze`"
            echo "- Controller test: `mobile_money_payout_eligibility_controller_test.dart`"
            echo "- Widget test: `mobile_money_payout_eligibility_page_test.dart`"
            echo "- Full suite: `flutter test`"
            echo "- Diff check: `git diff --check ${BASE_SHA}..${CANDIDATE_SHA}`"
            echo "- Job status: **${{ job.status }}**"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Report certification status
        if: always() && steps.candidate_assertion.outcome == 'success'
        uses: actions/github-script@v7
        env:
          CERTIFICATION_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const succeeded = process.env.CERTIFICATION_JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.CANDIDATE_SHA,
              state: succeeded ? 'success' : 'failure',
              context: process.env.STATUS_CONTEXT,
              description: succeeded
                ? 'Beta2.24 payout eligibility UI certified'
                : 'Beta2.24 payout eligibility UI certification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
