name: Mobile Beta2.29 Head Certification

on:
  push:
    branches:
      - ci/mobile-beta2.29-head-certification
    paths:
      - '.github/workflows/mobile-beta2.29-head-certification.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CANDIDATE_SHA: 98163299b4fa8548c0a6c768e4a4cef51ebce032
      BASE_SHA: fff2bda1fc3d510f6d0517f894d6c0e09dbaec1a
      PRODUCT_BRANCH: feature/mobile-beta2.29
      EXPECTED_COMMITS: '3'
      STATUS_CONTEXT: mobile-beta2.29/head-certification

    defaults:
      run:
        working-directory: apps/mobile_app

    steps:
      - name: Checkout exact Beta2.29 head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Assert exact candidate lineage and stable product branch
        id: candidate_assertion
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$CANDIDATE_SHA"
          git cat-file -e "$CANDIDATE_SHA^{commit}"
          git cat-file -e "$BASE_SHA^{commit}"
          test "$(git merge-base "$BASE_SHA" "$CANDIDATE_SHA")" = "$BASE_SHA"
          test "$(git rev-list --count "$BASE_SHA..$CANDIDATE_SHA")" = "$EXPECTED_COMMITS"
          remote_head="$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$CANDIDATE_SHA"

      - name: Mark certification pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.CANDIDATE_SHA,
              state: 'pending',
              context: process.env.STATUS_CONTEXT,
              description: 'Beta2.29 exact-head certification in progress',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test payout quote controller
        run: flutter test test/mobile_money_payout_quote_controller_test.dart

      - name: Test payout quote page
        run: flutter test test/mobile_money_payout_quote_page_test.dart

      - name: Verify candidate diff
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA..$CANDIDATE_SHA"

      - name: Reassert stable product branch
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$CANDIDATE_SHA"

      - name: Report certification status
        if: always() && steps.candidate_assertion.outcome == 'success'
        uses: actions/github-script@v7
        env:
          CERTIFICATION_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const succeeded = process.env.CERTIFICATION_JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.CANDIDATE_SHA,
              state: succeeded ? 'success' : 'failure',
              context: process.env.STATUS_CONTEXT,
              description: succeeded
                ? 'Beta2.29 exact head certified'
                : 'Beta2.29 exact-head certification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
