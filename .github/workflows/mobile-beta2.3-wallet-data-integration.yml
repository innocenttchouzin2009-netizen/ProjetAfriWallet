name: Mobile Beta2.3 Wallet Data Integration

on:
  push:
    branches:
      - feature/mobile-beta2.3
    paths:
      - 'apps/mobile_app/lib/data/remote/wallet_remote_data_source.dart'
      - 'apps/mobile_app/test/wallet_remote_data_source_test.dart'
      - '.github/workflows/mobile-beta2.3-wallet-data-integration.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/mobile_app/lib/data/remote/wallet_remote_data_source.dart'
      - 'apps/mobile_app/test/wallet_remote_data_source_test.dart'
      - '.github/workflows/mobile-beta2.3-wallet-data-integration.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify lockfile is synchronized
        run: git diff --exit-code -- pubspec.lock

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test Beta2.3 mobile wallet remote data source
        run: flutter test test/wallet_remote_data_source_test.dart

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Verify Beta2.3 diff
        working-directory: .
        run: git diff --check da4fd6b01f9ca6f25b6f97fa573a304486bee88e..HEAD
