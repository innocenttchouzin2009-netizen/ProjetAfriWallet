name: Mobile Beta2.33 Payout Quote Intent Presentation Certification

on:
  push:
    branches:
      - feature/mobile-beta2.33
    paths:
      - '.github/workflows/mobile-beta2.33-payout-quote-intent-presentation.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CANDIDATE_SHA: f791f5e0d5e7b29cc2220f2329a06254775c1583
      BASE_SHA: 4b444deb432474ed8d2357af1a81277dfc38f285
      COMMIT1_SHA: f36ce70a4b7b7cf512448129198a55f0f9c446b2
      CI_ONLY_SHA: 083a65c3816fb996de62ac995da15c621d5e5b28
      COMMIT2_SHA: 93768c16339a4f55785bc86312f75603a4bbe0e2
      RECERT_CI_SHA: 5a889ac75289a764da62559490aca7924b54913f
      EXPECTED_TOTAL_COMMITS: '5'
      EXPECTED_FUNCTIONAL_COMMITS: '2'
      STATUS_CONTEXT: mobile-beta2.33/payout-quote-intent-presentation

    defaults:
      run:
        working-directory: apps/mobile_app

    steps:
      - name: Checkout exact Beta2.33 Commit 2 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Assert exact candidate lineage
        id: candidate_assertion
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${CANDIDATE_SHA}"

          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${COMMIT1_SHA}^{commit}"
          git cat-file -e "${CI_ONLY_SHA}^{commit}"
          git cat-file -e "${COMMIT2_SHA}^{commit}"
          git cat-file -e "${RECERT_CI_SHA}^{commit}"
          git cat-file -e "${CANDIDATE_SHA}^{commit}"

          test "$(git merge-base "${BASE_SHA}" "${CANDIDATE_SHA}")" = "${BASE_SHA}"
          test "$(git rev-list --count "${BASE_SHA}..${CANDIDATE_SHA}")" = "${EXPECTED_TOTAL_COMMITS}"

          test "$(git rev-parse "${COMMIT1_SHA}^")" = "${BASE_SHA}"
          test "$(git rev-parse "${CI_ONLY_SHA}^")" = "${COMMIT1_SHA}"
          test "$(git rev-parse "${COMMIT2_SHA}^")" = "${CI_ONLY_SHA}"
          test "$(git rev-parse "${RECERT_CI_SHA}^")" = "${COMMIT2_SHA}"
          test "$(git rev-parse "${CANDIDATE_SHA}^")" = "${RECERT_CI_SHA}"

          ci_changed_files="$(git diff-tree --no-commit-id --name-only -r "${CI_ONLY_SHA}")"
          test "${ci_changed_files}" = ".github/workflows/mobile-beta2.33-payout-quote-intent-presentation.yml"

          recert_ci_changed_files="$(git diff-tree --no-commit-id --name-only -r "${RECERT_CI_SHA}")"
          test "${recert_ci_changed_files}" = ".github/workflows/mobile-beta2.33-payout-quote-intent-presentation.yml"

          candidate_changed_files="$(git diff-tree --no-commit-id --name-only -r "${CANDIDATE_SHA}")"
          test "${candidate_changed_files}" = "apps/mobile_app/test/mobile_money_payout_quote_page_test.dart"

          test "${EXPECTED_FUNCTIONAL_COMMITS}" = "2"

      - name: Mark certification pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.CANDIDATE_SHA,
              state: 'pending',
              context: process.env.STATUS_CONTEXT,
              description: 'Beta2.33 Commit 2 certification in progress',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test payout quote controller
        run: flutter test test/mobile_money_payout_quote_controller_test.dart

      - name: Test payout quote page
        run: flutter test test/mobile_money_payout_quote_page_test.dart

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Verify Beta2.33 candidate diff
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${BASE_SHA}..${CANDIDATE_SHA}"

      - name: Write certification summary
        if: always()
        working-directory: .
        shell: bash
        run: |
          {
            echo "## Mobile Beta2.33 Commit 2 certification"
            echo
            echo "- Candidate Commit 2: \`${CANDIDATE_SHA}\`"
            echo "- Beta2.32 frozen base: \`${BASE_SHA}\`"
            echo "- Functional Commit 1: \`${COMMIT1_SHA}\`"
            echo "- Historical CI-only commit: \`${CI_ONLY_SHA}\`"
            echo "- Functional Commit 2: \`${COMMIT2_SHA}\`"
            echo "- Commit 2 recertification CI-only commit: \`${RECERT_CI_SHA}\`"
            echo "- Commit 2 certification/test-fix candidate: \`${CANDIDATE_SHA}\`"
            echo "- Functional commits: \`${EXPECTED_FUNCTIONAL_COMMITS}\`"
            echo "- Git commits in candidate lineage: \`${EXPECTED_TOTAL_COMMITS}\`"
            echo "- Analyze: \`flutter analyze\`"
            echo "- Controller test: \`mobile_money_payout_quote_controller_test.dart\`"
            echo "- Page test: \`mobile_money_payout_quote_page_test.dart\`"
            echo "- Flutter suite: \`flutter test\`"
            echo "- Diff check: \`git diff --check ${BASE_SHA}..${CANDIDATE_SHA}\`"
            echo "- Workflow update commits are certification-only and are not functional Commit 3."
            echo "- Job status: **${{ job.status }}**"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Report certification status
        if: always() && steps.candidate_assertion.outcome == 'success'
        uses: actions/github-script@v7
        env:
          CERTIFICATION_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const succeeded = process.env.CERTIFICATION_JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.CANDIDATE_SHA,
              state: succeeded ? 'success' : 'failure',
              context: process.env.STATUS_CONTEXT,
              description: succeeded
                ? 'Beta2.33 Commit 2 certified'
                : 'Beta2.33 Commit 2 certification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
