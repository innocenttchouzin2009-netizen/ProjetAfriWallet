name: Mobile Beta2.34 Funding Intent Commit 1 Certification

on:
  push:
    branches:
      - feature/mobile-beta2.34
    paths:
      - '.github/workflows/mobile-beta2.34-funding-intent-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BASE_SHA: 9dd34d530a122b68788df2f28eed42a7b9bc9892
      COMMIT1_SHA: 125c5f4c37dcfe03d6d45d0426799d2e288959c8
      STATUS_CONTEXT: mobile-beta2.34/funding-intent-commit1
      WORKFLOW_PATH: .github/workflows/mobile-beta2.34-funding-intent-foundation.yml

    defaults:
      run:
        working-directory: apps/mobile_app

    steps:
      - name: Checkout certification commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert Commit 1 lineage and CI-only scope
        id: candidate_assertion
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${GITHUB_SHA}"

          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${COMMIT1_SHA}^{commit}"
          git cat-file -e "${GITHUB_SHA}^{commit}"

          test "$(git merge-base "${BASE_SHA}" "${COMMIT1_SHA}")" = "${BASE_SHA}"
          test "$(git rev-parse "${COMMIT1_SHA}^")" = "${BASE_SHA}"
          test "$(git rev-parse "${GITHUB_SHA}^")" = "${COMMIT1_SHA}"

          commit1_files="$(git diff-tree --no-commit-id --name-only -r "${COMMIT1_SHA}")"
          expected_commit1_files="$(
            printf '%s\n' \
              'apps/mobile_app/lib/models/mobile_money_payout_funding_intent.dart' \
              'apps/mobile_app/lib/services/mobile_money_payout_funding_intent_mapper.dart' \
              'apps/mobile_app/test/mobile_money_payout_funding_intent_mapper_test.dart' \
              'apps/mobile_app/test/mobile_money_payout_funding_intent_test.dart'
          )"
          test "${commit1_files}" = "${expected_commit1_files}"

          ci_files="$(git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}")"
          test "${ci_files}" = "${WORKFLOW_PATH}"

      - name: Mark Commit 1 certification pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.COMMIT1_SHA,
              state: 'pending',
              context: process.env.STATUS_CONTEXT,
              description: 'Beta2.34 Funding Intent Commit 1 certification in progress',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test Funding Intent model
        run: flutter test test/mobile_money_payout_funding_intent_test.dart

      - name: Test Funding Intent mapper
        run: flutter test test/mobile_money_payout_funding_intent_mapper_test.dart

      - name: Run Mobile Money payout regression suite
        shell: bash
        run: flutter test test/mobile_money_payout_*.dart

      - name: Verify Beta2.34 Commit 1 diff
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${BASE_SHA}..${COMMIT1_SHA}"

      - name: Write certification summary
        if: always()
        working-directory: .
        shell: bash
        run: |
          {
            echo "## Mobile Beta2.34 Funding Intent Commit 1 certification"
            echo
            echo "- Base: `${BASE_SHA}`"
            echo "- Functional Commit 1: `${COMMIT1_SHA}`"
            echo "- CI-only commit: `${GITHUB_SHA}`"
            echo "- Flutter: `3.47.2`"
            echo "- Analyze: `flutter analyze`"
            echo "- Funding Intent model test: `mobile_money_payout_funding_intent_test.dart`"
            echo "- Funding Intent mapper test: `mobile_money_payout_funding_intent_mapper_test.dart`"
            echo "- Regression suite: `mobile_money_payout_*.dart`"
            echo "- Diff check: `git diff --check ${BASE_SHA}..${COMMIT1_SHA}`"
            echo "- CI-only commit is certification infrastructure and is not functional Commit 2."
            echo "- Job status: **${{ job.status }}**"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Report Commit 1 certification status
        if: always() && steps.candidate_assertion.outcome == 'success'
        uses: actions/github-script@v7
        env:
          CERTIFICATION_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const succeeded = process.env.CERTIFICATION_JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.COMMIT1_SHA,
              state: succeeded ? 'success' : 'failure',
              context: process.env.STATUS_CONTEXT,
              description: succeeded
                ? 'Beta2.34 Funding Intent Commit 1 certified'
                : 'Beta2.34 Funding Intent Commit 1 certification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
