name: Mobile Beta2.34 Funding Selection Presentation Commit 3 Certification

on:
  push:
    branches:
      - feature/mobile-beta2.34
    paths:
      - '.github/workflows/mobile-beta2.34-funding-selection-presentation.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BASE_SHA: e9316af2cce8e58679e570be31c46073e81e917c
      COMMIT3_SHA: 7499941d5b9ff0a4844d03b9371c04f0869a5db5
      STATUS_CONTEXT: mobile-beta2.34/funding-selection-presentation-commit3
      WORKFLOW_PATH: .github/workflows/mobile-beta2.34-funding-selection-presentation.yml

    defaults:
      run:
        working-directory: apps/mobile_app

    steps:
      - name: Checkout exact Commit 3 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT3_SHA }}
          fetch-depth: 0

      - name: Assert exact Commit 3 lineage and four-file scope
        id: candidate_assertion
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${COMMIT3_SHA}"

          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${COMMIT3_SHA}^{commit}"
          test "$(git rev-parse "${COMMIT3_SHA}^")" = "${BASE_SHA}"
          test "$(git merge-base "${BASE_SHA}" "${COMMIT3_SHA}")" = "${BASE_SHA}"
          test "$(git rev-list --count "${BASE_SHA}..${COMMIT3_SHA}")" = "1"

          changed_files="$(git diff --name-only "${BASE_SHA}..${COMMIT3_SHA}")"
          expected_files="$({
          printf '%s\n' \
            'apps/mobile_app/lib/pages/mobile_money_payout_funding_selection_page.dart' \
            'apps/mobile_app/lib/presentation/mobile_money_payout_funding_selection_controller.dart' \
            'apps/mobile_app/test/mobile_money_payout_funding_selection_controller_test.dart' \
            'apps/mobile_app/test/mobile_money_payout_funding_selection_page_test.dart'
          } | sort)"
          test "$(printf '%s\n' "${changed_files}" | sort)" = "${expected_files}"

      - name: Mark Commit 3 certification pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.COMMIT3_SHA,
              state: 'pending',
              context: process.env.STATUS_CONTEXT,
              description: 'Beta2.34 Funding Selection Commit 3 certification in progress',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test funding selection controller
        run: flutter test test/mobile_money_payout_funding_selection_controller_test.dart

      - name: Test funding selection page
        run: flutter test test/mobile_money_payout_funding_selection_page_test.dart

      - name: Run Mobile Money payout regression suite
        shell: bash
        run: flutter test test/mobile_money_payout_*.dart

      - name: Verify exact Commit 3 diff
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${BASE_SHA}..${COMMIT3_SHA}"

      - name: Write certification summary
        if: always()
        working-directory: .
        shell: bash
        run: |
          {
            echo "## Mobile Beta2.34 Funding Selection Presentation Commit 3 certification"
            echo
            echo "- Base: `${BASE_SHA}`"
            echo "- Functional Commit 3: `${COMMIT3_SHA}`"
            echo "- Scope: exactly four funding-selection files"
            echo "- Analyze: `flutter analyze`"
            echo "- Controller test: `mobile_money_payout_funding_selection_controller_test.dart`"
            echo "- Page test: `mobile_money_payout_funding_selection_page_test.dart`"
            echo "- Regression suite: `mobile_money_payout_*.dart`"
            echo "- Diff check: `git diff --check ${BASE_SHA}..${COMMIT3_SHA}`"
            echo "- Job status: **${{ job.status }}**"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Report Commit 3 certification status
        if: always() && steps.candidate_assertion.outcome == 'success'
        uses: actions/github-script@v7
        env:
          CERTIFICATION_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const succeeded = process.env.CERTIFICATION_JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.COMMIT3_SHA,
              state: succeeded ? 'success' : 'failure',
              context: process.env.STATUS_CONTEXT,
              description: succeeded
                ? 'Beta2.34 Funding Selection Commit 3 certified'
                : 'Beta2.34 Funding Selection Commit 3 certification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
