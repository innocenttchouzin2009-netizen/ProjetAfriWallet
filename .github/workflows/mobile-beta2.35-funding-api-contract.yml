name: Mobile Beta2.35 Funding API Contract Commit 1 Certification

on:
  push:
    branches:
      - feature/mobile-beta2.35
    paths:
      - '.github/workflows/mobile-beta2.35-funding-api-contract.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BASE_SHA: e351587ca61f9bb933e8cd4a8da576a3a26b141f
      COMMIT1_SHA: 745e47536849bdc8e4e97dc45d851d1b2e675e6a
      STATUS_CONTEXT: mobile-beta2.35/funding-api-contract-commit1
      WORKFLOW_PATH: .github/workflows/mobile-beta2.35-funding-api-contract.yml

    defaults:
      run:
        working-directory: apps/mobile_app

    steps:
      - name: Checkout certification commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert Commit 1 lineage and CI-only scope
        id: candidate_assertion
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${GITHUB_SHA}"

          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${COMMIT1_SHA}^{commit}"
          git cat-file -e "${GITHUB_SHA}^{commit}"

          test "$(git merge-base "${BASE_SHA}" "${COMMIT1_SHA}")" = "${BASE_SHA}"
          test "$(git rev-parse "${COMMIT1_SHA}^")" = "${BASE_SHA}"
          test "$(git rev-parse "${GITHUB_SHA}^")" = "${COMMIT1_SHA}"

          commit1_files="$(git diff-tree --no-commit-id --name-only -r "${COMMIT1_SHA}")"
          expected_commit1_files="$(
            printf '%s\n' \
              'apps/mobile_app/lib/data/remote/mobile_money_payout_funding_dto.dart' \
              'apps/mobile_app/lib/data/remote/mobile_money_payout_funding_mapper.dart' \
              'apps/mobile_app/test/mobile_money_payout_funding_contract_test.dart'
          )"
          test "${commit1_files}" = "${expected_commit1_files}"

          ci_files="$(git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}")"
          test "${ci_files}" = "${WORKFLOW_PATH}"

      - name: Mark Commit 1 certification pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.COMMIT1_SHA,
              state: 'pending',
              context: process.env.STATUS_CONTEXT,
              description: 'Beta2.35 Funding API Contract Commit 1 certification in progress',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test Mobile Money payout funding contract
        run: flutter test test/mobile_money_payout_funding_contract_test.dart

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Verify Beta2.35 Commit 1 diff
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${BASE_SHA}..${COMMIT1_SHA}"

      - name: Write certification summary
        if: always()
        working-directory: .
        shell: bash
        run: |
          {
            echo "## Mobile Beta2.35 Funding API Contract Commit 1 certification"
            echo
            echo "- Base: \`${BASE_SHA}\`"
            echo "- Functional Commit 1: \`${COMMIT1_SHA}\`"
            echo "- CI-only commit: \`${GITHUB_SHA}\`"
            echo "- Flutter: \`3.47.2\`"
            echo "- Analyze: \`flutter analyze\`"
            echo "- Targeted test: \`mobile_money_payout_funding_contract_test.dart\`"
            echo "- Full suite: \`flutter test\`"
            echo "- Diff check: \`git diff --check ${BASE_SHA}..${COMMIT1_SHA}\`"
            echo "- CI-only commit is certification infrastructure and is not functional Commit 2."
            echo "- Job status: **${{ job.status }}**"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Report Commit 1 certification status
        if: always() && steps.candidate_assertion.outcome == 'success'
        uses: actions/github-script@v7
        env:
          CERTIFICATION_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const succeeded = process.env.CERTIFICATION_JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.COMMIT1_SHA,
              state: succeeded ? 'success' : 'failure',
              context: process.env.STATUS_CONTEXT,
              description: succeeded
                ? 'Beta2.35 Funding API Contract Commit 1 certified'
                : 'Beta2.35 Funding API Contract Commit 1 certification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
