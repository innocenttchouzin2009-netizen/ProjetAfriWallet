name: Mobile Beta2.36 Funding Remote Repository Commit 1 Certification

on:
  push:
    branches:
      - feature/mobile-beta2.36
    paths:
      - '.github/workflows/mobile-beta2.36-funding-remote-repository.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      BASE_SHA: 1d39156702cc71f84dd2f1d427d1f63bb1c03709
      COMMIT1_SHA: d0eb83bd720d982d5f8ec7099bf713de081a1026
      WORKFLOW_PATH: .github/workflows/mobile-beta2.36-funding-remote-repository.yml

    defaults:
      run:
        working-directory: apps/mobile_app

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert Commit 1 lineage and exact six-file scope
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${GITHUB_SHA}"
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${COMMIT1_SHA}^{commit}"
          test "$(git rev-parse "${COMMIT1_SHA}^")" = "${BASE_SHA}"
          test "$(git merge-base "${BASE_SHA}" "${COMMIT1_SHA}")" = "${BASE_SHA}"
          test "$(git rev-list --count "${BASE_SHA}..${COMMIT1_SHA}")" = "1"

          changed_files="$(git diff --name-only "${BASE_SHA}..${COMMIT1_SHA}" | sort)"
          expected_files="$(
            printf '%s\n' \
              'apps/mobile_app/lib/data/remote/mobile_money_payout_funding_remote_data_source.dart' \
              'apps/mobile_app/lib/models/mobile_money_payout_funding_plan.dart' \
              'apps/mobile_app/lib/services/mobile_money_payout_funding_repository.dart' \
              'apps/mobile_app/test/mobile_money_payout_funding_plan_test.dart' \
              'apps/mobile_app/test/mobile_money_payout_funding_remote_data_source_test.dart' \
              'apps/mobile_app/test/mobile_money_payout_funding_repository_test.dart' | sort
          )"
          test "${changed_files}" = "${expected_files}"

          git merge-base --is-ancestor "${COMMIT1_SHA}" "${actual_sha}"
          for follow_up_sha in $(git rev-list "${COMMIT1_SHA}..${actual_sha}"); do
            while IFS= read -r changed_path; do
              test "${changed_path}" = "${WORKFLOW_PATH}" || {
                echo "::error::Out-of-scope follow-up file: ${changed_path}"
                exit 1
              }
            done < <(git diff-tree --no-commit-id --name-only -r "${follow_up_sha}")
          done

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test funding plan
        run: flutter test test/mobile_money_payout_funding_plan_test.dart

      - name: Test funding remote data source
        run: flutter test test/mobile_money_payout_funding_remote_data_source_test.dart

      - name: Test funding repository
        run: flutter test test/mobile_money_payout_funding_repository_test.dart

      - name: Run funding regression suite
        run: flutter test test/mobile_money_payout_funding_*.dart

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Verify exact Commit 1 diff
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${BASE_SHA}..${COMMIT1_SHA}"
