name: Mobile Beta2.39 Execution Handoff Certification

on:
  push:
    branches:
      - feature/mobile-beta2.39
    paths:
      - 'apps/mobile_app/lib/models/mobile_money_payout_execution_handoff.dart'
      - 'apps/mobile_app/lib/services/mobile_money_payout_execution_handoff_policy.dart'
      - 'apps/mobile_app/test/mobile_money_payout_execution_handoff_policy_test.dart'
      - '.github/workflows/mobile-beta2.39-execution-handoff.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/mobile_app/lib/models/mobile_money_payout_execution_handoff.dart'
      - 'apps/mobile_app/lib/services/mobile_money_payout_execution_handoff_policy.dart'
      - 'apps/mobile_app/test/mobile_money_payout_execution_handoff_policy_test.dart'
      - '.github/workflows/mobile-beta2.39-execution-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'feature/mobile-beta2.39' }}
    name: Certify Beta2.39 execution handoff foundation
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      BASE_SHA: 9a4cf712c5118d27a2b8d27e4b6c895462e12947
      COMMIT1_SHA: fe2052f0475f94af61d59edc31cb87d54ba588ed
      WORKFLOW_PATH: .github/workflows/mobile-beta2.39-execution-handoff.yml

    defaults:
      run:
        working-directory: apps/mobile_app

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert Beta2.39 lineage and exact three-file Commit 1 scope
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${GITHUB_SHA}"

          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${COMMIT1_SHA}^{commit}"
          test "$(git rev-parse "${COMMIT1_SHA}^")" = "${BASE_SHA}"
          test "$(git merge-base "${BASE_SHA}" "${COMMIT1_SHA}")" = "${BASE_SHA}"
          test "$(git rev-list --count "${BASE_SHA}..${COMMIT1_SHA}")" = "1"

          changed_files="$(git diff --name-only "${BASE_SHA}..${COMMIT1_SHA}" | sort)"
          expected_files="$(
            printf '%s\n' \
              'apps/mobile_app/lib/models/mobile_money_payout_execution_handoff.dart' \
              'apps/mobile_app/lib/services/mobile_money_payout_execution_handoff_policy.dart' \
              'apps/mobile_app/test/mobile_money_payout_execution_handoff_policy_test.dart' | sort
          )"
          test "${changed_files}" = "${expected_files}"

          git merge-base --is-ancestor "${COMMIT1_SHA}" "${actual_sha}"

          for follow_up_sha in $(git rev-list "${COMMIT1_SHA}..${actual_sha}"); do
            while IFS= read -r changed_path; do
              test "${changed_path}" = "${WORKFLOW_PATH}" || {
                echo "::error::Out-of-scope pre-Commit-2 file: ${changed_path}"
                exit 1
              }
            done < <(git diff-tree --no-commit-id --name-only -r "${follow_up_sha}")
          done

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test execution handoff policy
        run: flutter test test/mobile_money_payout_execution_handoff_policy_test.dart

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Verify Beta2.39 diff
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${GITHUB_SHA}"
          git diff --check "${BASE_SHA}..${actual_sha}"
