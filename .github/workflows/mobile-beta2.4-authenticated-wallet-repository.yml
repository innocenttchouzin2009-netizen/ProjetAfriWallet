name: Mobile Beta2.4 Authenticated Wallet Repository

on:
  push:
    branches:
      - feature/mobile-beta2.4
    paths:
      - 'apps/mobile_app/lib/services/wallet_repository.dart'
      - 'apps/mobile_app/lib/data/remote/wallet_remote_data_source.dart'
      - 'apps/mobile_app/test/wallet_repository_test.dart'
      - 'apps/mobile_app/test/wallet_remote_data_source_test.dart'
      - '.github/workflows/mobile-beta2.4-authenticated-wallet-repository.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/mobile_app/lib/services/wallet_repository.dart'
      - 'apps/mobile_app/lib/data/remote/wallet_remote_data_source.dart'
      - 'apps/mobile_app/test/wallet_repository_test.dart'
      - 'apps/mobile_app/test/wallet_remote_data_source_test.dart'
      - '.github/workflows/mobile-beta2.4-authenticated-wallet-repository.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/mobile_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify lockfile is synchronized
        run: git diff --exit-code -- pubspec.lock

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test Beta2.4 wallet repository
        run: flutter test test/wallet_repository_test.dart

      - name: Test wallet remote data source contract
        run: flutter test test/wallet_remote_data_source_test.dart

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Verify Beta2.4 diff
        working-directory: .
        run: git diff --check dc742bbc2169c07b8413a01b286779aff6bbc219..HEAD
