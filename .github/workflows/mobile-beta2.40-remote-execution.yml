name: Mobile Beta2.40 Remote Execution Certification

on:
  push:
    branches:
      - feature/mobile-beta2.40
    paths:
      - 'apps/mobile_app/lib/data/remote/mobile_money_payout_execution_dto.dart'
      - 'apps/mobile_app/lib/data/remote/mobile_money_payout_execution_mapper.dart'
      - 'apps/mobile_app/lib/data/remote/mobile_money_payout_execution_remote_data_source.dart'
      - 'apps/mobile_app/test/mobile_money_payout_execution_remote_data_source_test.dart'
      - '.github/workflows/mobile-beta2.40-remote-execution.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/mobile_app/lib/data/remote/mobile_money_payout_execution_dto.dart'
      - 'apps/mobile_app/lib/data/remote/mobile_money_payout_execution_mapper.dart'
      - 'apps/mobile_app/lib/data/remote/mobile_money_payout_execution_remote_data_source.dart'
      - 'apps/mobile_app/test/mobile_money_payout_execution_remote_data_source_test.dart'
      - '.github/workflows/mobile-beta2.40-remote-execution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'feature/mobile-beta2.40' }}
    name: Certify Beta2.40 remote execution foundation
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      BASE_SHA: 19a81c5cc5736c3bce14d14b34d22e6d8e7a8c49
      COMMIT1_SHA: 5638a1b4b5148343b481d4007c4f6710f8eb2113
      TEST_PATH: apps/mobile_app/test/mobile_money_payout_execution_remote_data_source_test.dart

    defaults:
      run:
        working-directory: apps/mobile_app

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert Beta2.40 lineage and Commit 1 scope
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${GITHUB_SHA}"

          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${COMMIT1_SHA}^{commit}"
          test "$(git rev-parse "${COMMIT1_SHA}^")" = "${BASE_SHA}"
          test "$(git merge-base "${BASE_SHA}" "${COMMIT1_SHA}")" = "${BASE_SHA}"
          test "$(git rev-list --count "${BASE_SHA}..${COMMIT1_SHA}")" = "1"

          changed_files="$(git diff --name-only "${BASE_SHA}..${COMMIT1_SHA}" | sort)"
          expected_files="$(
            printf '%s\n' \
              'apps/mobile_app/lib/data/remote/mobile_money_payout_execution_dto.dart' \
              'apps/mobile_app/lib/data/remote/mobile_money_payout_execution_mapper.dart' \
              'apps/mobile_app/lib/data/remote/mobile_money_payout_execution_remote_data_source.dart' \
              'apps/mobile_app/test/mobile_money_payout_execution_remote_data_source_test.dart' | sort
          )"
          test "${changed_files}" = "${expected_files}"

          git merge-base --is-ancestor "${COMMIT1_SHA}" "${actual_sha}"

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test remote payout execution data source
        run: flutter test ${TEST_PATH#apps/mobile_app/}

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Verify Beta2.40 diff
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${GITHUB_SHA}"
          git diff --check "${BASE_SHA}..${actual_sha}"
