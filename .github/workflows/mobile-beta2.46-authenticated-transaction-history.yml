name: Mobile Beta2.46 Authenticated Transaction History Certification

on:
  push:
    branches:
      - feature/mobile-beta2.46
    paths:
      - 'apps/mobile_app/lib/services/authenticated_production_wiring.dart'
      - 'apps/mobile_app/lib/services/transaction_history_repository.dart'
      - 'apps/mobile_app/test/transaction_history_repository_test.dart'
      - '.github/workflows/mobile-beta2.46-authenticated-transaction-history.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/mobile_app/lib/services/authenticated_production_wiring.dart'
      - 'apps/mobile_app/lib/services/transaction_history_repository.dart'
      - 'apps/mobile_app/test/transaction_history_repository_test.dart'
      - '.github/workflows/mobile-beta2.46-authenticated-transaction-history.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'feature/mobile-beta2.46' }}
    name: Certify Beta2.46 authenticated transaction history
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      BASE_SHA: 5f06253a67155d0e6c12aaa01c07a454dc4412a6
      TARGET_SHA: 8780c7518c42fbd130b0ba90db7aa9ce00deb303
      TRANSACTION_HISTORY_TEST: apps/mobile_app/test/transaction_history_repository_test.dart

    defaults:
      run:
        working-directory: apps/mobile_app

    steps:
      - name: Checkout exact Beta2.46 functional head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Assert Beta2.46 lineage and functional scope
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${TARGET_SHA}"

          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${TARGET_SHA}^{commit}"
          test "$(git rev-parse "${TARGET_SHA}^")" = "${BASE_SHA}"
          test "$(git merge-base "${BASE_SHA}" "${TARGET_SHA}")" = "${BASE_SHA}"
          test "$(git rev-list --count "${BASE_SHA}..${TARGET_SHA}")" = "1"

          changed_files="$(git diff --name-only "${BASE_SHA}..${TARGET_SHA}" | sort)"
          expected_files="$(
            printf '%s\n' \
              'apps/mobile_app/lib/services/authenticated_production_wiring.dart' \
              'apps/mobile_app/lib/services/transaction_history_repository.dart' \
              'apps/mobile_app/test/transaction_history_repository_test.dart' | sort
          )"
          test "${changed_files}" = "${expected_files}"

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify lockfile is synchronized
        run: git diff --exit-code -- pubspec.lock

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test transaction history repository
        run: flutter test ${TRANSACTION_HISTORY_TEST#apps/mobile_app/}

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Verify Beta2.46 diff
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "${actual_sha}" = "${TARGET_SHA}"
          git diff --check "${BASE_SHA}..${TARGET_SHA}"
