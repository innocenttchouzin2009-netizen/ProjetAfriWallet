name: Mobile Beta2.49 Auth Device Context Certification

on:
  push:
    branches:
      - feature/mobile-beta2.49
    paths:
      - '.github/workflows/mobile-beta2.49-auth-device-context.yml'
      - 'apps/mobile_app/lib/services/secure_auth_device_context_provider.dart'
      - 'apps/mobile_app/lib/services/secure_storage_adapter.dart'
      - 'apps/mobile_app/test/secure_auth_device_context_provider_test.dart'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CANDIDATE_SHA: ${{ github.sha }}
      BASE_SHA: feb6f485664006c0a94d8f7c9cd091758fb19f17
      STATUS_CONTEXT: mobile-beta2.49/auth-device-context-certification

    defaults:
      run:
        working-directory: apps/mobile_app

    steps:
      - name: Checkout exact Beta2.49 triggering head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Assert exact triggering head
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "candidate_sha=${CANDIDATE_SHA}"
          echo "checked_out_sha=${actual_sha}"
          test "${actual_sha}" = "${CANDIDATE_SHA}"
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          git cat-file -e "${BASE_SHA}^{commit}"
          git merge-base --is-ancestor "${BASE_SHA}" "${CANDIDATE_SHA}"

      - name: Mark certification pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.CANDIDATE_SHA,
              state: 'pending',
              context: process.env.STATUS_CONTEXT,
              description: 'Beta2.49 auth device context certification in progress',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test secure auth device context provider
        run: flutter test test/secure_auth_device_context_provider_test.dart

      - name: Run complete Flutter suite
        run: flutter test

      - name: Verify Beta2.49 candidate diff
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${BASE_SHA}...${CANDIDATE_SHA}"

      - name: Write certification summary
        if: always()
        working-directory: .
        shell: bash
        run: |
          {
            echo "## Mobile Beta2.49 auth device context certification"
            echo
            echo "- Candidate: `${CANDIDATE_SHA}`"
            echo "- Base: `${BASE_SHA}`"
            echo "- Job status: **${{ job.status }}**"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Report certification status
        if: always()
        uses: actions/github-script@v7
        env:
          CERTIFICATION_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const succeeded = process.env.CERTIFICATION_JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.CANDIDATE_SHA,
              state: succeeded ? 'success' : 'failure',
              context: process.env.STATUS_CONTEXT,
              description: succeeded
                ? 'Beta2.49 auth device context candidate certified'
                : 'Beta2.49 auth device context candidate certification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
