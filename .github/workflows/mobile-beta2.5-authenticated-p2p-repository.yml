name: Mobile Beta2.5 Authenticated P2P Repository

on:
  push:
    branches:
      - feature/mobile-beta2.5
    paths:
      - 'apps/mobile_app/lib/data/remote/p2p_remote_data_source.dart'
      - 'apps/mobile_app/lib/services/transfer_repository.dart'
      - 'apps/mobile_app/test/p2p_remote_data_source_test.dart'
      - 'apps/mobile_app/test/transfer_repository_test.dart'
      - '.github/workflows/mobile-beta2.5-authenticated-p2p-repository.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/mobile_app/lib/data/remote/p2p_remote_data_source.dart'
      - 'apps/mobile_app/lib/services/transfer_repository.dart'
      - 'apps/mobile_app/test/p2p_remote_data_source_test.dart'
      - 'apps/mobile_app/test/transfer_repository_test.dart'
      - '.github/workflows/mobile-beta2.5-authenticated-p2p-repository.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/mobile_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify lockfile is synchronized
        run: git diff --exit-code -- pubspec.lock

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test P2P remote data source contract
        run: flutter test test/p2p_remote_data_source_test.dart

      - name: Test authenticated transfer repository
        run: flutter test test/transfer_repository_test.dart

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Verify Beta2.5 diff
        working-directory: .
        run: git diff --check ef6e350a02c1acbad8b555153355bb2a3509c038..HEAD
