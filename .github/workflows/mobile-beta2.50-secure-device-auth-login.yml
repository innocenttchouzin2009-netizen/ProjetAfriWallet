name: Mobile Beta2.50 Secure Device Auth Login Certification

on:
  push:
    branches:
      - feature/mobile-beta2.50
    paths:
      - '.github/workflows/mobile-beta2.50-secure-device-auth-login.yml'
      - 'apps/mobile_app/lib/services/auth_production_wiring.dart'
      - 'apps/mobile_app/test/auth_production_wiring_test.dart'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CANDIDATE_SHA: ${{ github.sha }}
      BASE_SHA: 308109b6d574e6bc937302b8a505419926b748f1
      STATUS_CONTEXT: mobile-beta2.50/secure-device-auth-login-certification

    defaults:
      run:
        working-directory: apps/mobile_app

    steps:
      - name: Checkout exact Beta2.50 triggering head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Assert exact triggering head and lineage
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "candidate_sha=${CANDIDATE_SHA}"
          echo "checked_out_sha=${actual_sha}"
          echo "base_sha=${BASE_SHA}"
          test "${actual_sha}" = "${CANDIDATE_SHA}"
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          git cat-file -e "${BASE_SHA}^{commit}"
          git merge-base --is-ancestor "${BASE_SHA}" "${CANDIDATE_SHA}"
          test "$(git merge-base "${BASE_SHA}" "${CANDIDATE_SHA}")" = "${BASE_SHA}"

      - name: Mark certification pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.CANDIDATE_SHA,
              state: 'pending',
              context: process.env.STATUS_CONTEXT,
              description: 'Beta2.50 secure device auth login certification in progress',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Verify Beta2.50 scope allowlist
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail

          allowed_file_1=".github/workflows/mobile-beta2.50-secure-device-auth-login.yml"
          allowed_file_2="apps/mobile_app/lib/services/auth_production_wiring.dart"
          allowed_file_3="apps/mobile_app/test/auth_production_wiring_test.dart"

          mapfile -t changed_files < <(git diff --name-only "${BASE_SHA}...${CANDIDATE_SHA}" | sort)

          printf 'Changed files:\n'
          printf '  %s\n' "${changed_files[@]}"

          test "${#changed_files[@]}" -eq 3

          for file in "${changed_files[@]}"; do
            case "${file}" in
              "${allowed_file_1}"|"${allowed_file_2}"|"${allowed_file_3}") ;;
              *)
                echo "Unexpected file in Beta2.50 diff: ${file}" >&2
                exit 1
                ;;
            esac
          done

          for required in "${allowed_file_1}" "${allowed_file_2}" "${allowed_file_3}"; do
            printf '%s\n' "${changed_files[@]}" | grep -Fxq "${required}"
          done

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test secure auth device context provider
        run: flutter test test/secure_auth_device_context_provider_test.dart

      - name: Test secure device production auth login wiring
        run: flutter test test/auth_production_wiring_test.dart

      - name: Run complete Flutter suite
        run: flutter test

      - name: Verify Beta2.50 candidate diff
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${BASE_SHA}...${CANDIDATE_SHA}"

      - name: Write certification summary
        if: always()
        working-directory: .
        shell: bash
        run: |
          {
            echo "## Mobile Beta2.50 secure device auth login certification"
            echo
            echo "- Candidate: `${CANDIDATE_SHA}`"
            echo "- Base: `${BASE_SHA}`"
            echo "- Allowed functional files: `auth_production_wiring.dart`, `auth_production_wiring_test.dart`"
            echo "- Dedicated tests: secure device context provider + production auth wiring"
            echo "- Job status: **${{ job.status }}**"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Report certification status
        if: always()
        uses: actions/github-script@v7
        env:
          CERTIFICATION_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const succeeded = process.env.CERTIFICATION_JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.CANDIDATE_SHA,
              state: succeeded ? 'success' : 'failure',
              context: process.env.STATUS_CONTEXT,
              description: succeeded
                ? 'Beta2.50 secure device auth login candidate certified'
                : 'Beta2.50 secure device auth login candidate certification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
