name: Mobile Beta2.56 Authenticated Quote Handoff Certification

on:
  push:
    branches:
      - feature/mobile-beta2.56
    paths:
      - '.github/workflows/mobile-beta2.56-mobile-money-authenticated-quote-handoff.yml'
      - 'apps/mobile_app/lib/data/remote/mobile_money_payout_quote_remote_data_source.dart'
      - 'apps/mobile_app/lib/main.dart'
      - 'apps/mobile_app/lib/pages/mobile_money_payout_quote_intent_entry_page.dart'
      - 'apps/mobile_app/lib/pages/wallet_home_page.dart'
      - 'apps/mobile_app/lib/services/authenticated_production_wiring.dart'
      - 'apps/mobile_app/lib/services/mobile_money_payout_quote_repository.dart'
      - 'apps/mobile_app/test/authenticated_production_wiring_test.dart'
      - 'apps/mobile_app/test/mobile_money_payout_quote_intent_entry_page_test.dart'
      - 'apps/mobile_app/test/mobile_money_payout_quote_remote_data_source_test.dart'
      - 'apps/mobile_app/test/mobile_money_payout_quote_repository_test.dart'
      - 'apps/mobile_app/test/wallet_home_page_test.dart'
      - 'apps/mobile_app/test/widget_test.dart'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      WORKFLOW_SHA: ${{ github.sha }}
      PRODUCT_CANDIDATE_SHA: 30ed8eea08d7da67b07a0817b3a1dfdb0b71204c
      BASE_SHA: 27cb31058e783b115ebf7c1c8740fb4a905cc8fa
      STATUS_CONTEXT: mobile-beta2.56/authenticated-quote-handoff-certification

    defaults:
      run:
        working-directory: apps/mobile_app

    steps:
      - name: Checkout exact Beta2.56 certification head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORKFLOW_SHA }}
          fetch-depth: 0

      - name: Assert exact Beta2.55 baseline and Beta2.56 lineage
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${WORKFLOW_SHA}"
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${PRODUCT_CANDIDATE_SHA}^{commit}"
          git merge-base --is-ancestor "${BASE_SHA}" "${PRODUCT_CANDIDATE_SHA}"
          test "$(git merge-base "${BASE_SHA}" "${PRODUCT_CANDIDATE_SHA}")" = "${BASE_SHA}"
          git merge-base --is-ancestor "${PRODUCT_CANDIDATE_SHA}" "${WORKFLOW_SHA}"

      - name: Mark Beta2.56 product candidate pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.PRODUCT_CANDIDATE_SHA,
              state: 'pending',
              context: process.env.STATUS_CONTEXT,
              description: 'Beta2.56 authenticated quote handoff certification in progress',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Verify exact Beta2.56 product allowlist
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          allowed=(
            "apps/mobile_app/lib/data/remote/mobile_money_payout_quote_remote_data_source.dart"
            "apps/mobile_app/lib/main.dart"
            "apps/mobile_app/lib/pages/mobile_money_payout_quote_intent_entry_page.dart"
            "apps/mobile_app/lib/pages/wallet_home_page.dart"
            "apps/mobile_app/lib/services/authenticated_production_wiring.dart"
            "apps/mobile_app/lib/services/mobile_money_payout_quote_repository.dart"
            "apps/mobile_app/test/authenticated_production_wiring_test.dart"
            "apps/mobile_app/test/mobile_money_payout_quote_intent_entry_page_test.dart"
            "apps/mobile_app/test/mobile_money_payout_quote_remote_data_source_test.dart"
            "apps/mobile_app/test/mobile_money_payout_quote_repository_test.dart"
            "apps/mobile_app/test/wallet_home_page_test.dart"
            "apps/mobile_app/test/widget_test.dart"
          )
          mapfile -t changed_files < <(git diff --name-only "${BASE_SHA}...${PRODUCT_CANDIDATE_SHA}" | sort)
          test "${#changed_files[@]}" -eq 12
          for file in "${changed_files[@]}"; do
            printf '%s\n' "${allowed[@]}" | grep -Fxq "${file}"
          done
          for required in "${allowed[@]}"; do
            printf '%s\n' "${changed_files[@]}" | grep -Fxq "${required}"
          done

      - name: Verify certification harness allowlist
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed_files < <(git diff --name-only "${PRODUCT_CANDIDATE_SHA}...${WORKFLOW_SHA}" | sort)
          test "${#changed_files[@]}" -eq 1
          test "${changed_files[0]}" = ".github/workflows/mobile-beta2.56-mobile-money-authenticated-quote-handoff.yml"

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test quote intent entry
        run: flutter test test/mobile_money_payout_quote_intent_entry_page_test.dart

      - name: Test Wallet Home resolved-beneficiary handoff
        run: flutter test test/wallet_home_page_test.dart

      - name: Test integrated app quote journey
        run: flutter test test/widget_test.dart

      - name: Test authenticated quote transport and repository
        run: |
          flutter test test/mobile_money_payout_quote_remote_data_source_test.dart
          flutter test test/mobile_money_payout_quote_repository_test.dart

      - name: Test production wiring
        run: flutter test test/authenticated_production_wiring_test.dart

      - name: Re-test beneficiary and quote presentation regressions
        run: |
          flutter test test/mobile_money_beneficiary_search_controller_test.dart
          flutter test test/mobile_money_beneficiary_search_page_test.dart
          flutter test test/mobile_money_payout_quote_intent_mapper_test.dart
          flutter test test/mobile_money_payout_quote_page_test.dart

      - name: Run complete Flutter suite
        run: flutter test

      - name: Verify Beta2.56 diffs
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${BASE_SHA}...${PRODUCT_CANDIDATE_SHA}"
          git diff --check "${PRODUCT_CANDIDATE_SHA}...${WORKFLOW_SHA}"

      - name: Write certification summary
        if: always()
        working-directory: .
        shell: bash
        run: |
          {
            echo "## Mobile Beta2.56 Resolved Beneficiary → Authenticated Quote"
            echo
            echo "- Base Beta2.55: ${BASE_SHA}"
            echo "- Product candidate: ${PRODUCT_CANDIDATE_SHA}"
            echo "- Certification head: ${WORKFLOW_SHA}"
            echo "- Scope: resolved beneficiary → authoritative primary wallet + exact amount → authenticated quote"
            echo "- Existing quote/funding/execution components reused; no backend changes"
            echo "- Beta2.55 Wallet Home entry and existing quick actions preserved"
            echo "- Job status: **${{ job.status }}**"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Report Beta2.56 product candidate certification
        if: always()
        uses: actions/github-script@v7
        env:
          CERTIFICATION_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const succeeded = process.env.CERTIFICATION_JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.PRODUCT_CANDIDATE_SHA,
              state: succeeded ? 'success' : 'failure',
              context: process.env.STATUS_CONTEXT,
              description: succeeded
                ? 'Beta2.56 authenticated quote handoff candidate certified'
                : 'Beta2.56 authenticated quote handoff certification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
