name: Mobile Beta2.8 Offline Read Resilience

on:
  push:
    branches:
      - feature/mobile-beta2.8
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'push' || github.head_ref == 'feature/mobile-beta2.8'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/mobile_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify lockfile is synchronized
        run: git diff --exit-code -- pubspec.lock

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test resilience foundation
        run: flutter test test/resilience/

      - name: Run complete Flutter test suite
        run: flutter test

      - name: Verify Beta2.8 diff
        working-directory: .
        run: git diff --check 08d7339bd31f66b2c325970b7a898cec5121651b..HEAD
