name: resolution-orchestration

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/src/Disputes/ResolutionOrchestration/**'
      - 'backend/tests/ResolutionOrchestration.Scenarios/**'
      - 'tools/release/validate-resolution-orchestration.ps1'
      - 'tools/release/scan-resolution-orchestration-secrets.ps1'
      - 'docs/specs/resolution-orchestration/**'
      - '.github/workflows/resolution-orchestration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolution-orchestration:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate AFW-DLV-0018.5
        shell: pwsh
        run: ./tools/release/validate-resolution-orchestration.ps1 -Configuration Release
      - name: Verify git diff
        shell: pwsh
        run: git diff --check
