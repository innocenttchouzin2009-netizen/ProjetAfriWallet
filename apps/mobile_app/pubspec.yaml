name: afriwallet_mobile
description: AfriWallet mobile application.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  afw_design_system:
    path: ../../packages/afw_design_system
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/afriwallet_logo.png
