openapi: 3.0.3
info:
  title: AfriWallet API
  version: 0.2.0
paths:
  /api/v1/auth/register:
    post:
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                phone:
                  type: string
                language:
                  type: string
                country:
                  type: string
      responses:
        '200':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
                  status:
                    type: string
  /internal/subscriptions/connectors/{providerId}/capabilities:
    get:
      summary: Discover connector capabilities
      parameters:
        - in: path
          name: providerId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Connector capabilities
  /internal/subscriptions/connectors/{providerId}/activate:
    post:
      summary: Activate a subscription through a provider connector
      parameters:
        - in: path
          name: providerId
          required: true
          schema:
            type: string
        - in: query
          name: subscriptionId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Connector activation response
  /internal/subscriptions/connectors/{providerId}/health:
    get:
      summary: Check connector health
      parameters:
        - in: path
          name: providerId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Connector health response
