openapi: 3.0.3
info:
  title: AfriSubscriptions Provider Registry API
  version: 1.0.0
paths:
  /api/v1/subscriptions/providers:
    get:
      summary: List providers
      parameters:
        - in: query
          name: country
          schema:
            type: string
        - in: query
          name: currency
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Successful response
  /api/v1/subscriptions/providers/search:
    get:
      summary: Search providers
      parameters:
        - in: query
          name: q
          schema:
            type: string
      responses:
        '200':
          description: Successful response
  /api/v1/subscriptions/providers/{providerId}:
    get:
      summary: Get provider details
      parameters:
        - in: path
          name: providerId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
  /api/v1/subscriptions/providers/{providerId}/plans:
    get:
      summary: List provider plans
      parameters:
        - in: path
          name: providerId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
