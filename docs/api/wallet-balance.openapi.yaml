openapi: 3.0.3
info:
  title: Universal Wallet Balance Projection API
  version: 0.3.3
  description: Projection-only balance endpoints derived from immutable ledger entries.
paths:
  /api/v1/balances/{walletId}:
    get:
      summary: Get wallet balance projection state
      parameters:
        - name: walletId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Projection state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceProjectionStateResponse'
        '404':
          description: Wallet not found
  /api/v1/balances/{walletId}/rebuild:
    post:
      summary: Rebuild wallet balance projection from ledger
      parameters:
        - name: walletId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Rebuilt projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceProjectionStateResponse'
        '404':
          description: Wallet not found
components:
  schemas:
    BalanceProjection:
      type: object
      properties:
        walletId:
          type: string
          format: uuid
        currency:
          type: string
        ledgerBalance:
          type: number
          format: decimal
        availableBalance:
          type: number
          format: decimal
        pendingBalance:
          type: number
          format: decimal
        reservedBalance:
          type: number
          format: decimal
        incomingToday:
          type: number
          format: decimal
        outgoingToday:
          type: number
          format: decimal
        lastLedgerPosition:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
    ProjectionVersion:
      type: object
      properties:
        walletId:
          type: string
          format: uuid
        ledgerPosition:
          type: integer
          format: int64
        version:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
    BalanceProjectionStateResponse:
      type: object
      properties:
        projection:
          $ref: '#/components/schemas/BalanceProjection'
        currentLedgerPosition:
          type: integer
          format: int64
        isUpToDate:
          type: boolean
        wasLagging:
          type: boolean
        version:
          $ref: '#/components/schemas/ProjectionVersion'
