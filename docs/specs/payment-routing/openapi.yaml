openapi: 3.0.1
info:
  title: AfriWallet Payment Routing API
  version: 1.0.0
paths:
  /health/live:
    get:
      responses:
        '200':
          description: Healthy
  /api/v1/payment-routing/route:
    post:
      responses:
        '200':
          description: Routing decision
  /api/v1/payment-routing/providers:
    get:
      responses:
        '200':
          description: Providers
  /api/v1/payment-routing/decisions/{paymentIntentId}:
    get:
      parameters:
        - in: path
          name: paymentIntentId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Decision
        '404':
          description: Not found
